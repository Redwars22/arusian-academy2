            {"n":15,"t":"Numerals","r":"Kuwei-kot","s":"Tok ,auk","b":[{"k":"p","h":"Below are several tables displaying the first thousand numerals in Arusian. Traditionally, the Arusian numeral system was based on a quinary (base-five) counting system. However, due to Western influence, it transitioned to a decimal (base-ten) system. While this shift introduced greater complexity, native speakers have no difficulty articulating their numerals. The tables below illustrate this numeral system in detail."},{"k":"t","cap":[["t","Numerals 1 - 10"]],"rows":[[{"c":1,"th":false,"l":[["s","Ta ,aP"],["r","Pei-at"]]},{"c":1,"th":false,"l":[["s","at ,aP"],["r","Pei-ta"]]},{"c":1,"th":false,"l":[["s","fet ,aP"],["r","Pei-tef"]]},{"c":1,"th":false,"l":[["s","fek ,aP"],["r","Pei-kef"]]},{"c":1,"th":false,"l":[["s",",aM ,aP"],["r","Pei-mei"]]}],[{"c":1,"th":true,"l":[["n","1"]]},{"c":1,"th":true,"l":[["n","2"]]},{"c":1,"th":true,"l":[["n","3"]]},{"c":1,"th":true,"l":[["n","4"]]},{"c":1,"th":true,"l":[["n","5"]]}],[{"c":1,"th":false,"l":[["s","oak ,aP"],["r","Pei-kau"]]},{"c":1,"th":false,"l":[["s","cea ,aP"],["r","Pei-aek"]]},{"c":1,"th":false,"l":[["s",",al ,aP"],["r","Pei-lei"]]},{"c":1,"th":false,"l":[["s","ara ,aP"],["r","Pei-ara"]]},{"c":1,"th":false,"l":[["s",",aM at ,aP"],["r","Pei-ta-mei"]]}],[{"c":1,"th":true,"l":[["n","6"]]},{"c":1,"th":true,"l":[["n","7"]]},{"c":1,"th":true,"l":[["n","8"]]},{"c":1,"th":true,"l":[["n","9"]]},{"c":1,"th":true,"l":[["n","10"]]}]]},{"k":"p","h":"The Prefix <i>Pei</i> is added to indicate that the roots are numerals and not ordinary words All numerals in Arusian, are prefixed by <i>pei</i> with the exception of one."},{"k":"t","cap":[["t","Ordinal Numerals 1 - 5"]],"rows":[[{"c":1,"th":false,"l":[["s","Ged al"],["r","La-deg"]]},{"c":1,"th":false,"l":[["s","at al"],["r","La-ta"]]},{"c":1,"th":false,"l":[["s","fet al"],["r","La-tef"]]},{"c":1,"th":false,"l":[["s","fek al"],["r","La-kef"]]},{"c":1,"th":false,"l":[["s",",aM al"],["r","La-mei"]]}],[{"c":1,"th":true,"l":[["n","1st"]]},{"c":1,"th":true,"l":[["n","2nd"]]},{"c":1,"th":true,"l":[["n","3rd"]]},{"c":1,"th":true,"l":[["n","4th"]]},{"c":1,"th":true,"l":[["n","5th"]]}]]},{"k":"p","h":"As shown above, ordinal numerals are made by preffixing the root <i>la</i> (each) to the end of numbers."},{"k":"p","h":"Below shows how to use numerals to indicate the amount the speaker is talking about. Here are a few examples."},{"k":"e","n":"Example 15.2","sub":[],"s":[". at ,aP as seM .",". Ta ,aP as lev oaN ."],"r":"Mes sa pei-ta. Nau-vel sa pei-at.","g":"house LINK NUM-two apple LINK one","p":[],"e":"Two houses. One apple."},{"k":"e","n":"Example 15.3","sub":[],"s":[". rmak ul as u at ,aP as oaN uj ."],"r":"Ju-nau sa pei-ta u sa lu kamr.","g":"banana LINK NUM-two RES.TOPIC LINK 1 have","p":[],"e":"I have 2 bananas."},{"k":"p","h":"Above are examples 15.1, 15.2, and 15.3 of numerals being in a sentence. Numerals are attached to there heads with <i>sa/-s</i> linker."},{"k":"t","cap":[["t","More Numerals"]],"rows":[[{"c":1,"th":false,"l":[["s",",aM at at ,aP"],["r","Pei ta ta mei"]]},{"c":1,"th":false,"l":[["s",",aM at fet ,aP"],["r","Pei tef ta mei"]]},{"c":1,"th":false,"l":[["s",",aM at ceP at ,aP"],["n","Pei lei ta mei"]]},{"c":1,"th":false,"l":[["s","ced ,aP"],["r","Pei dek"]]},{"c":1,"th":false,"l":[["s","ced at ,aP"],["r","Pei ta dek"]]}],[{"c":1,"th":true,"l":[["n","20"]]},{"c":1,"th":true,"l":[["n","30"]]},{"c":1,"th":true,"l":[["n","80"]]},{"c":1,"th":true,"l":[["n","100"]]},{"c":1,"th":true,"l":[["n","200"]]}],[{"c":1,"th":false,"l":[["s","ced fet ,aP"],["r","Pei tef dek"]]},{"c":1,"th":false,"l":[["s","ced ,aM at ,aP"],["r","Pei ta mei dek"]]},{"c":1,"th":false,"l":[["s","ced ,aM at at ,aP"],["n","Pei ta ta mei dek"]]},{"c":1,"th":false,"l":[["s","ced ced ,aP"],["r","Pei dek dek"]]},{"c":1,"th":false,"l":[["s","ced ced at ,aP"],["r","Pei ta dek dek"]]}],[{"c":1,"th":true,"l":[["n","300"]]},{"c":1,"th":true,"l":[["n","1000"]]},{"c":1,"th":true,"l":[["n",             {"n":16,"t":"Phonology","r":"Mo-Dem","s":"med oM","b":[{"k":"p","h":"The Standard dialect of Arusian has a small inventory of consonants and vowels compared to English. Arusian prononciation is much simpler than English, as consonants rarely cluster together such as in English words like “strength”. Below are two charts displaying all of Arusian’s consonants and vowels present in the language."},{"k":"t","cap":[["s","j,ek oM"],["r","Consonants"]],"rows":[[{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","Bilabial"]]},{"c":1,"th":true,"l":[["t","Alveolar"]]},{"c":1,"th":true,"l":[["t","Post"],["t","Alveolar"]]},{"c":1,"th":true,"l":[["t","Palata"],["t","l"]]},{"c":1,"th":true,"l":[["t","Velar"]]},{"c":1,"th":true,"l":[["t","Uvular"]]},{"c":1,"th":true,"l":[["t","Glottal"]]}],[{"c":1,"th":true,"l":[["t","Nasal"]]},{"c":1,"th":true,"l":[["t","m"]]},{"c":1,"th":true,"l":[["t","n"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]}],[{"c":1,"th":true,"l":[["t","plosive"]]},{"c":1,"th":true,"l":[["t","p b"]]},{"c":1,"th":true,"l":[["t","t d"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","k g"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","(ʔ)"]]}],[{"c":1,"th":true,"l":[["t","Fricative"]]},{"c":1,"th":true,"l":[["t","ɸ β"]]},{"c":1,"th":true,"l":[["t","s"],["t","(z)"]]},{"c":1,"th":true,"l":[["t","ʃ ʒ"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","ʁ"]]},{"c":1,"th":false,"l":[]}],[{"c":1,"th":true,"l":[["t","Lateral"],["t","Approx."]]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","l"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]}],[{"c":1,"th":true,"l":[["t","Approximant"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","(j)"]]},{"c":1,"th":true,"l":[["t","(w)"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]}]]},{"k":"p","h":"Above is the consonant inventory of the Standard Arusian language. Different dialects vary in pronunciation."},{"k":"t","cap":[["s","ag oM"],["r","Vowels"]],"rows":[[{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","Front"]]},{"c":1,"th":true,"l":[["t","Central"]]},{"c":1,"th":true,"l":[["t","Back"]]}],[{"c":1,"th":true,"l":[["t","Close"]]},{"c":1,"th":true,"l":[["t","i"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","u"]]}],[{"c":1,"th":true,"l":[["t","Close-mid"]]},{"c":1,"th":true,"l":[["t","(e)"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":true,"l":[["t","o"]]}],[{"c":1,"th":true,"l":[["t","Open-mid"]]},{"c":1,"th":true,"l":[["t","ɛ"]]},{"c":1,"th":true,"l":[["t","ɜ"]]},{"c":1,"th":false,"l":[]}],[{"c":1,"th":true,"l":[["t","Open"]]},{"c":1,"th":true,"l":[["t","a"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]}]]},{"k":"p","h":"For those who are unfamiliar, the symbols are in the international phonetic alphabet (IPA). They are approximations for sounds produced in human speech. Each symbol is on this chart is placed in a box corresponding to where the sound is produced in the mouth, and how it is produced. The symbols in parentheses are allophones, (variations of another sound)."},{"k":"h","t":"Pronunciation"},{"k":"p","h":"Arusian pronunciation, for the most part has a CVC structure, meaning that consonants don’t like to go together. Often in speech, consonants are broken apart by invisible vowels. When spoken fast, clustering does occur in some cases, but this varies from person to person."},{"k":"p","h":"Another feature of Arusian speech is pitch accent. With pitch accent, some roots are pronounced with a higher pitch then other roots. In Arusian, topics are marked with a high pitch and comments are not. In the examples below, high pitched roots will be marked with the color red along with the pronunciation."},{"k":"e","n":"Example 16.1","sub":[],"s":[". s,ab TuN road ul ."],"r":"lu dauwr nut beis.","g":"","p":["/lu dauwɜ nuʔ ɛˑ bes/","/lu dauwɜ nuʔ bes/"],"e":"I eat good food."},{"k":"e","n":"Example 16.2","sub":[],"s":[". sauok ,at as jev ."],"r":"Vej sa tei kouwas.","g":"","p":["/βɛʒ ɛˑ sa te kouwas/","/βɛʒ ʃa te kouwas/"],"e":"You don’t do/act."},{"k":"p","h":"In example 16.1, lu is pronounced with a high pitch as it is the topic of the sentence. a short [ɛˑ] sound can be placed between the consonants to facilitate pronunciation. To note the short [ɛˑ], has no grammatical function, and is only there to aid in a smoother pronunciation. It isn’t written in writing, and is only audible in speech."},{"k":"p","h":"In example 16.2, there are two possible pronunciations. In the top pronunciation, [ɛˑ] splits the consonants [ʒ] and [s] in the roots <i>Vej</i> and <i>sa.</i> In the bottom pronunciation, the sentence is likely spoken quicker, and the [ʒ] mutates the [s] into a [ʃ]. Here are some extra examples below."},{"k":"e","n":"Example 16.3","sub":[],"s":[". roa ,au sarTo m.ov as u m,et as seM ."],"r":"Mes sa tim u sa vom otras wei auwr.","g":"","p":["/mɛs sa tim u sa vom otɜʁas we auwɜ/"],"e":"Many people see a/the black house."},{"k":"p","h":"In example 16.3, the marker <i>u</i> always high pitch, as it conveys the clause before it is the topic. Notice the conjunction <i>wei,</i> is has no high pitch, as it is carries no information about the topic. High pitch is another way to mark The topic in Arusian."},{"k":"e","n":"Example 16.4","sub":[],"s":[". ruo cul as jaN cev ."],"r":"Vek-naj sa luk ouwr.","g":"","p":["/βɛk ɛˑ naʒ ʃa luk ouwɜ/"],"e":"The child wants a spaceship."},{"k":"p","h":"In example 16.4, the topic is composed of two roots <i>vek</i> (vehicle) and <i>naj</i> (cosmos). To break the consonants, a [ ɛ ˑ] sound is put between the two roots."},{"k":"h","t":"Long Vowels"},{"k":"p","h":"Long vowels are pronounced anytime the letters <i>ar, or,</i> or <i>er</i> are together. Here are some common words with long vowels."},{"k":"e","n":"","sub":[],"s":[",araM"],"r":"marei","g":"","p":["[maːʁe]"],"e":"you (for commands)"},{"k":"e","n":"","sub":[],"s":["rok"],"r":"kor","g":"","p":["[koː]"],"e":"to do"},{"k":"e","n":"","sub":[],"s":["reM"],"r":"mer","g":"","p":["[mɛː]"],"e":"to inhabit"},{"k":"p","h":"For the words below and other alike, these can be pronounced in two ways. They can be pronounced with two syllables or they can be pronounced with a long /eː/. Both pronunciations are equally valid and speakers often use these interchangeably."},{"k":"e","n":"","sub":[],"s":["de,at"],"r":"teyed","g":"","p":["/tejɛd/, /teːd/"],"e":"taking"},{"k":"e","n":"","sub":[],"s":["me,al"],"r":"leyem","g":"","p":["/lejɛm/, /leːm/"],"e":"romantic love"}]},
            {"n":17,"t":"Foreign Words","r":"Mewei-Tep","s":"Bet ,aueM","b":[{"k":"p","h":"Foreign words are written a special alphabet called <i>Sem-Ej</i> which is a simplified version of the <i>Sem-Lek</i> alphabet. Typically, foreign words are words that do not fit the natural phonological structure of native Arusian words, and are used when code switching or talking about foreign concepts. The s <i>a</i> copula can never been suffixed to <i>Sem-Ej</i> words. Here are a few examples of foreign words being used in Arusian."},{"k":"e","n":"Example 17.1","sub":[],"s":[". ruo ul as jer hn ha hm ha d he ha hp hs ."],"r":"Spiderman sa lu ouwr.","g":"Spiderman LINK 1 want","p":[],"e":"I like Spiderman."},{"k":"e","n":"Example 17.2","sub":[],"s":[". road os as TuN ha hl ho hk ha hk ho hk as jev ."],"r":"Vej sa Coca-Cola sa so dauwr.","g":"NEG LINK Coca-Cola LINK 3.OBV eat","p":[],"e":"He/She doesn't drink Coca-Cola."},{"k":"e","n":"Example 17.4","sub":[],"s":[". roa ul u s,aeb ceu hp hu ht ho e ."],"r":"YouTube beyeis u sa lu auwr.","g":"YouTube good-LINK RES.TOPIC LINK see","p":[],"e":"I see that YouTube is good."},{"k":"e","n":"Example 17.5","sub":[],"s":[". rt ul ruo ul as arat ho he hk ho ht ."],"r":"Tokyo sa lu ouwr lu tr.","g":"Tokyo LINK 1 want 1 toward","p":[],"e":"I want to go to Tokyo."},{"k":"p","h":"At the end of every sem-ej word, there is an unpronounced radical that hints at the meaning of the foreign word. Sem-ej lacks most sounds and sometimes requires extra context (such as a radical) to hint at the intended meaning. Writers use any native word as a radical that they feel will facilitate the meaning and there is no fixed rule for what radical to use with a particular foreign word."},{"k":"p","h":"Sometimes radicals are left out completely when the context is clear enough, as shown in the examples below."},{"k":"e","n":"Example 17.6","sub":[],"s":[". suP hn ho he hs ha hu hd he hs ,auP ."],"r":"Puwei-situation pus?","g":"Q-situation here-LINK","p":[],"e":"What is the situation here?"},{"k":"e","n":"Example 17.7","sub":[],"s":[". suP u s,ab hn ho he hs ha hk he l hp hs he ."],"r":"Explication beis u pus.","g":"explanation goodness-LINK RES.TOPIC here-LINK","p":[],"e":"This is a good explanation."}]},
            {"n":18,"t":"Politeness","r":"Ro","s":"or","b":[{"k":"p","h":"Politness is indicated with the root <i>Ro</i> . This root is a discourse marker that is linked to the topic of the sentence. There is no exact translation into English, however this root is similar in meaning to &#x27;sir&#x27; or &#x27;ma&#x27;am.&#x27; <i>Ro</i> is used to show respect to a person and it typically used with people you don&#x27;t know, parents, your boss or elders. Here are some examples."},{"k":"e","n":"Example 18.1","sub":[],"s":[". suP u s,at TuN or ."],"r":"Ro-nut teis u pus.","g":"POL-food 2-LINK RES.TOPIC here-LINK","p":[],"e":"Here is your food, sir/ma'am."},{"k":"e","n":"Example 18.2","sub":[],"s":[". sauad ,at ruo ,at ,auP or ."],"r":"Ro-puwei-tei ouwr tei dauwas?","g":"POL-Q-2 want 2 eating-LINK","p":[],"e":"What would you like to eat, sir/ma'am"},{"k":"e","n":"Example 18.3","sub":[],"s":[". rmak ul as aul ,alP or ."],"r":"Ro-plei-luwa sa lu kamr?","g":"POL-Q.REQ-water LINK have","p":[],"e":"Can I have water sir/ma'am."},{"k":"p","h":"The root, <i>ro</i> can also be put at the ends of proper nouns (much like <i>dei</i> ). This translates to &#x27;mr.&#x27; or &#x27;ms.&#x27; <i>Ro</i> is attached to someone&#x27;s name when you want to show respect to a person."},{"k":"e","n":"Example 18.4","sub":[],"s":[". suP or aeuj apeN ."],"r":"Nepa-Juweya-ro pus?","g":"Q.POLAR-Juweya-POL here-LINK","p":[],"e":"Is mr. Juweya here?"},{"k":"e","n":"Example 18.5","sub":[],"s":[". roa ul as or aeak ."],"r":"Kaya-ro sa lu auwr.","g":"Kaya-POL LINK 1 see","p":[],"e":"I see Mr. Kaya."},{"k":"p","h":"As shown in Examples 18.4 and 18.5, <i>-ro</i> is using like - <i>dei</i> , to indicate someones name. <i>-Ro</i> is a polite verson of dei and is used for elders, people of authority."}]},
            {"n":19,"t":"Family","r":"Sum","s":"mus","b":[{"k":"p","h":"Arusian has a variety of kinship terms that differentiate between levels of distance and unlike English, basic Arusian kinship terms lack gender. Below is"},{"k":"tree","n":{"s":"aM umu umu","r":"umu-umu-ma","g":"great-grandparent","c":[{"s":",aas aM umu","r":"umu-ma-sai","g":"grand-uncle/aunt","c":[{"s":",aas aM","r":"ma-sai","g":"aunt/uncle","c":[{"s":",aas","r":"sai","g":"sibling/cousin","c":[{"s":"cuP ,aas","r":"sai-puk","g":"niece/nephew","c":[]}]}]}]},{"s":"aM umu","r":"umu-ma","g":"grandparent","c":[{"s":"aM","r":"ma","g":"parent","c":[{"s":",at","r":"tei","g":"you","c":[{"s":"cuP","r":"puk","g":"son/daughter","c":[]}]},{"s":",aas","r":"sai","g":"sibling","c":[{"s":"cuP ,aas","r":"sai-puk","g":"niece/nephew","c":[]}]}]}]}]}},{"k":"p","h":"Arusian lacks gender for general familial terms, even lacking a word for mother and father, for the unisex term, <i>ma</i> meaning parent. However, there exist kinship terms to distinguish between mother and father or immediate sibling and cousin, though these terms are not as common. The word s <i>ai</i> , and <i>ma-sai</i> can also be used for people outside of your family to sound friendly. These terms can be found in the table below."},{"k":"t","cap":null,"rows":[[{"c":1,"th":false,"l":[["s","aM ,arlev"],["r","velrei-ma"],["n","mother"]]},{"c":1,"th":false,"l":[["s","aM ,arm.os"],["r","somrei-ma"],["n","father"]]},{"c":1,"th":false,"l":[["s","a,et"],["r","tiya"],["n","descendant/ancestor"]]}],[{"c":1,"th":false,"l":[["s",",aeM"],["r","miya"],["n","spouse"]]},{"c":1,"th":false,"l":[["s",",aas ,aas"],["r","sai-sai"],["n","brother/sister"]]},{"c":1,"th":false,"l":[["s",",aas umu"],["r","umu-sai"],["n","older brother/sister"]]}]]},{"k":"p","h":"The above table shows extra kinship words you might also hear. Miya and tiya are quite common. Now here are some examples with these words in use."},{"k":"e","n":"Example 19.1","sub":[],"s":[". suP u sarGert u sul ,aas ."],"r":"Sai lus u tregras u pus.","g":"sibling 1-LINK RES.TOP come-ACT.INTRANS RES.TOPIC here-LINK","p":[],"e":"My brother is coming here."},{"k":"e","n":"Example 19.2","sub":[],"s":[". suP ul .. ,aas umu u ."],"r":"U-umu-sai ! Lu pus.","g":"VOC-big-sibling | here-LINK","p":[],"e":"big brother/sister! I am here."}]}
        ];
    </script>
    <script>
        // ======== Config ========
        const API_URL = 'https://api-arusian-dict-microservice.vercel.app/dictionary';

        // entry type -> label
        const T = {
            root: 'Root',
            'root*': 'Root · no verb forms',
            'vt-a': 'Verb · transitive · AV',
            'vt-p': 'Verb · transitive · PV',
            'vi-a': 'Verb · intransitive · AV',
            'vi-p': 'Verb · intransitive · PV',
            form: 'Derived form',
            compound: 'Compound',
            discourse: 'Discourse marker',
            linker: 'Linker'
        };

        // ======== State ========
        // D: dictionary entries (loaded from the API) | ready: set once D is built
        let D = [];
        let ready = false;
        let IX, PH, FAM, USED, fcount;

        // ======== Helpers ========
        const esc = s => String(s).replace(/[&<>"]/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;'
        } [c]));
        const norm = t => t.toLowerCase().replace(/[^a-z\-' ]/g, '').replace(/^-+|-+$/g, '').trim();
        const $ = s => document.querySelector(s),
            app = $('#app'),
            tp = $('#tp');

        // sp: split a meaning on top-level commas (ignores commas inside brackets)
        const sp = g => {
            const o = [];
            let d = 0,
                c = '';
            for (const ch of g) {
                if (ch == '(') d++;
                if (ch == ')') d--;
                if (ch == ',' && !d) {
                    o.push(c.trim());
                    c = ''
                } else c += ch
            }
            o.push(c.trim());
            return o.filter(Boolean)
        };

        // ======== Data layer ========
        // ---- adapt API entry to internal shape ----
        // API:      { word, script, meaning, type, page, root_id, examples: [{ script, romanization, translation }] }
        // internal: w = word, s = script, g = meaning, t = type, p = page, f = root/family id,
        //           x = examples [{ s: [script lines], r: romanization, e: English }]
        //           n = normalised word, gl = lower-cased meaning, alt = has an "A OR B" spelling
        function adapt(raw) {
            const x = (raw.examples || []).map(ex => ({
                s: Array.isArray(ex.script) ? ex.script : [ex.script],
                r: ex.romanization || '',
                e: ex.translation ?? ex.english ?? ''
            }));
            return {
                w: raw.word,
                s: raw.script,
                g: raw.meaning ?? raw.gloss ?? '',
                t: raw.type,
                p: raw.page,
                f: raw.root_id,
                x: x.length ? x : undefined,   // undefined = no examples (entry page falls back to the word family)
                alt: (raw.word || '').includes(' OR '),
                n: norm((raw.word || '').replace(' OR ', ' ')),
                gl: (raw.meaning ?? raw.gloss ?? '').toLowerCase()
            };
        }

        const add = (m, k, v) => {
            (m.get(k) || m.set(k, []).get(k)).push(v)
        };

        // ---- lookup indexes ----
        // IX: word -> ids | PH: first/second word of a phrase -> ids | FAM: family id -> ids
        // USED: id -> [entry id, example index] of sentences that use the word | fcount: family id -> example count
        function buildIndexes() {
            IX = new Map();
            PH = new Map();
            FAM = new Map();
            USED = new Map();
            D.forEach((e, i) => {
                add(IX, e.n, i);
                if (e.n.includes(' ')) add(PH, e.n.split(' ')[0], i);
                if (e.alt) add(PH, e.n.split(' ')[1], i);
                add(FAM, e.f, i)
            })
        }

        const one = x => IX.get(x) || (x.endsWith('s') && IX.get(x.slice(0, -1))) || PH.get(x) || null;

        function look(t) {
            const n = norm(t);
            if (!n) return [];
            const r = one(n);
            if (r) return [{
                l: n,
                ids: r.slice(0, 4)
            }];
            if (n.includes('-')) {
                const g = n.split('-').map(p => ({
                    l: p,
                    ids: (one(p) || []).slice(0, 3)
                }));
                if (g.some(x => x.ids.length)) return g
            }
            return []
        }

        function buildUsedIndex() {
            USED = new Map();
            D.forEach((e, i) => (e.x || []).forEach((x, k) => {
                const s = new Set();
                x.r.split(/\s+/).forEach(t => look(t).forEach(g => g.ids.slice(0, 2).forEach(j => s.add(j))));
                s.forEach(j => {
                    if (j !== i) add(USED, j, [i, k])
                })
            }))
        }

        function buildFcount() {
            fcount = new Map();
            D.forEach(e => fcount.set(e.f, (fcount.get(e.f) || 0) + (e.x ? e.x.length : 0)))
        }


        // ======== Rendering helpers ========
        // sent: example sentence | kc: colour class | sc: script (+OR) | bd: type badge | row: word list row
        const sent = x => `<div class="sn"><div class="sc2">${x.s.map(l=>`<div>${esc(l)}</div>`).join('')}</div>${x.r?`<div class="sr">${x.r.split(/\s+/).map(t=>`<button class="tk" data-t="${esc(t)}">${esc(t)}</button>`).join(' ')}</div>`:''}<div class="se">${esc(x.e)}</div></div>`;
        const kc = e => 'k-' + ({
            root: 'r',
            'root*': 'b',
            linker: 'g',
            discourse: 'p'
        } [e.t] || 'k');
        const sc = s => esc(s).replace(' OR ', '<span class="or">OR</span>');
        const bd = e => `<span class="bd">${T[e.t]||e.t}</span>`;
        const row = i => {
            const e = D[i];
            return `<a class="rr ${kc(e)}" href="#w${i}"><span class="rs">${sc(e.s)}</span><span><span class="rw">${esc(e.w)}</span>${bd(e)}<span class="rg">${esc(e.g)}</span></span></a>`
        };
        const letters = () => [...new Set(D.map(e => e.n[0]).filter(c => c && /[a-z]/.test(c)))].sort();
        const azbar = c => `<div class="az">${letters().map(l=>`<a href="#letter-${l}" class="${l==c?'on':''}">${l.toUpperCase()}</a>`).join('')}</div>`;

        // ======== Dictionary views ========
        function home() {
            document.body.className = 'home';
            const nr = D.filter(e => e.t == 'root' || e.t == 'root*').length,
                ns = D.reduce((a, e) => a + (e.x ? e.x.length : 0), 0);
            const top = D.filter(e => e.t == 'root').sort((a, b) => fcount.get(b.f) - fcount.get(a.f)).slice(0, 12);
            app.innerHTML = `<section class="hero"><div class="hscript">Bet auM</div><h1>Arusian Dictionary</h1><p>Every word in the standard Arusian lexicon, written in the Sem-Lek script, with real example sentences. Search in Arusian or English.</p><input type="search" id="hq" placeholder="Search Arusian or English…" autocomplete="off"><a class="btn" href="#grammar">Learn More About Arusian</a><div class="st"><div><b>${D.length.toLocaleString()}</b><span>Words</span></div><div><b>${nr}</b><span>Roots</span></div><div><b>${ns}</b><span>Example sentences</span></div></div></section>
         <div id="hm"><h2>A better way to read Arusian</h2><div class="ft"><div><b>Sem-Lek script</b><span>Every entry is shown in its native script and romanization.</span></div><div><b>Click any word</b><span>Tap a word in an example sentence to see its English translation.</span></div><div><b>Roots &amp; word families</b><span>See every verb form and compound built from a root.</span></div><div><b>Grammar guide</b><span>Nineteen lessons from <i>An Introduction to Arusian</i>. <a href="#grammar">Start reading →</a></span></div><div><b>Interactive course</b><span>Short, game-style lessons built from real Arusian sentences. <a href="#course">Start learning →</a></span></div></div>
         <h2>Popular dictionary entries</h2><div class="pop">${top.map(e=>`<a class="pc ${kc(e)}" href="#w${D.indexOf(e)}"><span class="sc">${sc(e.s)}</span><b>${esc(e.w)}</b><small>${esc(e.g)}</small></a>`).join('')}</div>
         <h2>Browse by letter</h2>${azbar('')}</div><div id="rs" hidden></div>`
        }

        function entry(i) {
            const e = D[i];
            if (!e) return home();
            const m = sp(e.g),
                r = D[e.f],
                fam = FAM.get(e.f) || [i];
            let own = (e.x || []).map(sent).join(''),
                lab = 'Example sentences';
            const used = (USED.get(i) || []).slice(0, 5).map(([a, k]) => sent(D[a].x[k])).join('');
            let ex = own + (used ? `<div class="lab">Also used in</div>${used}` : '');
            if (!ex) {
                const f = fam.filter(j => j != i && D[j].x).slice(0, 3).flatMap(j => D[j].x.slice(0, 1).map(sent)).join('');
                ex = f ? `<div class="lab">From the same word family</div>${f}` : '<p class="mu">No example sentence has been written for this word yet.</p>'
            }
            app.innerHTML = `<a class="crumb" href="#browse">‹ Dictionary</a><div class="eh ${kc(e)}"><div class="scr">${sc(e.s)}</div><h1>${esc(e.w)}${bd(e)}</h1><div class="gl">${esc(e.g)}</div>${e.f!=i&&r?`<div class="meta"><span>Root: <a href="#w${e.f}">${esc(r.w)}</a></span></div>`:''}</div>
         <h2>${lab}</h2>${ex}<h2>Word family${fam.length>1?` · ${fam.length} entries`:''}</h2><div class="fam">${fam.map(j=>`<a href="#w${j}" class="${kc(D[j])} ${j==i?'cur':''}"><b>${esc(D[j].w)}</b> <span class="bd">${T[D[j].t]||D[j].t}</span><small>${esc(D[j].g)}</small></a>`).join('')}</div>`
        }

        function browse(c) {
            const ids = D.map((e, i) => i).filter(i => D[i].n[0] == c).sort((a, b) => D[a].n < D[b].n ? -1 : 1);
            app.innerHTML = `<h2 style="margin-top:0">Browse A–Z</h2>${azbar(c)}<p class="mu">${ids.length} words starting with “${c.toUpperCase()}”</p>${ids.map(row).join('')}`
        }

        function notation() {
            const k = [
                ['#c00000', 'Roots'],
                ['#000', 'Root forms — verb forms and compounds'],
                ['#4472c4', 'Roots with no verb forms'],
                ['#70ad47', 'Linkers'],
                ['#cf9c02', 'Sentences and clauses'],
                ['#a6a6a6', 'English translations'],
                ['#7030a0', 'Discourse markers']
            ];
            app.innerHTML = `<h2 style="margin-top:0">About this dictionary</h2><p>This dictionary contains all official Standard Arusian words. It does not include foreign borrowed words written in the Sem-Ej script. There are around 600 roots in the standard language, which can be compounded together and verbalized to create new words, for a total of around 5,000 words. English translations are approximate, since it is impossible to translate every word form exactly.</p><div class="lab">Colour key in the printed dictionary</div><div class="card kv">${k.map(([c,t])=>`<span class="sw" style="background:${c}"></span><span>${t}</span>`).join('')}</div><div class="lab">Verb form labels</div><p class="mu">AV and PV mark the active and passive forms of a verb, each in a transitive and an intransitive version. Sentences are shown in Sem-Lek script with a romanization underneath. Click any romanized word to see its translation.</p>`
        }

        let more = 60;

        function search(v) {
            const q = norm(v),
                hq = $('#hq');
            if (!q) {
                if (hq) {
                    $('#hm').hidden = false;
                    $('#rs').hidden = true
                } else route();
                return
            }
            const R = [];
            D.forEach((e, i) => {
                let s = 0;
                if (e.n == q) s = 100;
                else if (e.n.startsWith(q)) s = 80;
                else if (e.n.split(/[ \-]/).some(p => p.startsWith(q))) s = 60;
                else if (e.n.includes(q)) s = 40;
                const g = sp(e.gl).map(x => x.replace(/^(to|a|an|the) /, ''));
                let gs = 0;
                if (g.includes(q)) gs = 90;
                else if (/^[a-z ]+$/.test(q) && new RegExp('\\b' + q + '\\b').test(e.gl)) gs = 50;
                else if (e.gl.includes(q)) gs = 25;
                s = Math.max(s, gs);
                if (s) R.push([s - e.n.length / 100, i])
            });
            R.sort((a, b) => b[0] - a[0]);
            const sh = R.slice(0, more);
            const H = `<h2 style="margin-top:0">${R.length} result${R.length==1?'':'s'} for “${esc(v)}”</h2>${sh.map(r=>row(r[1])).join('')||'<p class="mu">No matching words. Try another spelling or an English word.</p>'}${R.length>more?'<button class="more" id="mb">Show more</button>':''}`;
            if (hq) {
                $('#hm').hidden = true;
                $('#rs').hidden = false;
                $('#rs').innerHTML = H
            } else app.innerHTML = H;
            $('#mb') && ($('#mb').onclick = () => {
                more += 100;
                search(v)
            })
        }

        // ======== Grammar views ========
        const rom = r => r.split(/\s+/).map(w => `<button class="tk" data-t="${esc(w)}">${esc(w)}</button>`).join(' ');
        const gln = l => l.map(([k, x]) => k == 's' ? `<div class="gxs2">${esc(x)}</div>` : k == 'r' ? `<div class="gxr">${rom(x)}</div>` : k == 'n' ? `<div class="gxg">${esc(x)}</div>` : `<div>${esc(x)}</div>`).join('');
        const gtb = t => `<div class="gxw">${t.cap?`<div class="gxcap">${t.cap.map(([k,x])=>k=='s'?`<span class="gxs2">${esc(x)}</span>`:`<b>${esc(x)}</b>`).join(' ')}</div>`:''}<table>${t.rows.map(r=>`<tr>${r.map(c=>{const g=c.th?'th':'td';return`<${g} colspan="${c.c}">${gln(c.l)}</${g}>`}).join('')}</tr>`).join('')}</table></div>`;
        const tn = n => `<li><div class="gxnode"><div class="gxs2">${esc(n.s)}</div><div class="gxr">${rom(n.r)}</div><div class="gxg">${esc(n.g)}</div></div>${n.c.length?`<ul>${n.c.map(tn).join('')}</ul>`:''}</li>`;
        const gb = b => {
            const k = b.k;
            if (k == 'p') return `<p>${b.h}</p>`;
            if (k == 'f') return `<div class="gxf">${esc(b.t)}</div>`;
            if (k == 'c') return `<div class="gxk">${esc(b.t)}</div>`;
            if (k == 't') return gtb(b);
            if (k == 'tree') return `<div class="gxtree"><ul>${tn(b.n)}</ul></div>`;
            return `<div class="gxe">${b.n?`<div class="gxm">${esc(b.n)}</div>`:''}${(b.sub||[]).map(x=>`<div class="gxsub">${esc(x)}</div>`).join('')}<div class="gxs">${b.s.map(l=>`<div>${esc(l)}</div>`).join('')}</div>${b.r?`<div class="gxr">${rom(b.r)}</div>`:''}${b.g?`<div class="gxg">${esc(b.g)}</div>`:''}${(b.p||[]).map(x=>`<div class="gxg">${esc(x)}</div>`).join('')}${b.e?`<div class="gxt">${esc(b.e)}</div>`:''}</div>`
        };

        function gram() {
            app.innerHTML = `<h2 style="margin-top:0">Arusian Grammar</h2><div class="eh"><div class="scr"> med oP </div><h1>Po-Dem</h1><div class="gl">Grammar</div><div class="meta"><span><i>An Introduction to Arusian: A Guide to Grammar and Syntax</i> by Joseph T. Trerotola</span></div></div><h2>Lessons</h2><div class="gxl">${G.map(l=>`<a class="gxc" href="#g${l.n}"><span class="gxn">${l.n||'A'}</span><span><b>${esc(l.t)}</b>${l.r?`<small class="mu" style="display:block"><i>${esc(l.r)}</i></small>`:''}</span></a>`).join('')}</div>`
        }

        function lesson(n) {
            const L = G.find(l => l.n == n);
            if (!L) return gram();
            let hi = 0;
            const hs = L.b.filter(b => b.k == 'h');
            const body = L.b.map(b => b.k == 'h' ? `<h3 class="gxh" id="gh${hi++}">${esc(b.t)}</h3>` : gb(b)).join('');
            const lk = (l, d) => l ? `<a href="#g${l.n}">${d=='p'?'‹ ':''}${l.n?'Lesson '+l.n:'Alphabets'}: ${esc(l.t)}${d=='n'?' ›':''}</a>` : '<span></span>';
            app.innerHTML = `<a class="crumb" href="#grammar">‹ Grammar</a><div class="eh">${L.s?`<div class="scr">${esc(L.s)}</div>`:''}<h1>${n?'Lesson '+n+': ':''}${esc(L.t)}</h1>${L.r?`<div class="gl"><i>${esc(L.r)}</i></div>`:''}${hs.length>1?`<div class="jump">${hs.map((h,i)=>`<button data-j="gh${i}">${esc(h.t)}</button>`).join('')}</div>`:''}</div><div class="gxb">${body}</div><div class="gnav">${lk(G.find(l=>l.n==n-1),'p')}${lk(G.find(l=>l.n==n+1),'n')}</div>`
        }

        // ======== Course (game-style lessons) ========
        const CS = {
            xp: 0,
            streak: 0,
            last: '',
            done: {}
        };
        try {
            Object.assign(CS, JSON.parse(localStorage.getItem('aruc1') || '{}'))
        } catch (e) {}
        const csSave = () => {
            try {
                localStorage.setItem('aruc1', JSON.stringify(CS))
            } catch (e) {}
        };
        const sh = a => {
            a = [...a];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.random() * (i + 1) | 0;
                [a[i], a[j]] = [a[j], a[i]]
            }
            return a
        };
        const pick = (a, n) => sh(a).slice(0, n);
        const nz = s => s.toLowerCase().replace(/[^a-z\-' ]/g, '').replace(/\s+/g, ' ').trim();
        let UN = null,
            ALL = [],
            GP = [],
            P = null;

        function units() {
            if (UN) return UN;
            UN = [];
            const tok = r => r.split(/\s+/).map(w => w.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, '')).filter(Boolean);
            G.forEach(l => {
                if (l.n < 3) return;
                const ex = [...new Map(l.b.filter(b => b.k == 'e' && b.s.length && b.r && b.e && !/[\/\d]/.test(b.r)).map(b => {
                    const r = b.r.replace(/[\[\]()]/g, '').replace(/\s+/g, ' ').trim();
                    return [nz(r), {
                        s: b.s,
                        r,
                        e: b.e,
                        t: tok(r)
                    }]
                })).values()].filter(x => x.t.length >= 2 && x.t.length <= 9);
                if (ex.length < 2) return;
                ex.sort((a, b) => a.t.length - b.t.length);
                const k = Math.max(1, Math.round(ex.length / 6)),
                    per = Math.ceil(ex.length / k),
                    ls = [];
                for (let i = 0; i < ex.length; i += per) ls.push(ex.slice(i, i + per));
                UN.push({
                    n: l.n,
                    t: l.t,
                    ls
                });
                ALL.push(...ex)
            });
            GP = D.map((e, i) => i).filter(i => {
                const m = sp(D[i].g)[0];
                return m && m.length <= 26 && m[0] != '(' && !/^or\b/.test(m) && D[i].t != 'discourse'
            });
            return UN
        }

        function winfo(t) {
            const g = look(t);
            if (g.length != 1 || g[0].ids.length != 1) return null;
            const i = g[0].ids[0],
                m = sp(D[i].g)[0];
            if (!m || m.length > 26 || m[0] == '(' || /^or\b/.test(m) || D[i].w.includes(' ')) return null;
            return {
                i,
                w: D[i].w,
                g: m
            }
        }

        function mk(L) {
            const ex = [],
                ws = [],
                seen = new Set();
            L.forEach(x => x.t.forEach(t => {
                const w = winfo(t);
                if (w && !seen.has(w.i)) {
                    seen.add(w.i);
                    ws.push(w)
                }
            }));
            const gm = w => {
                const o = [...new Set(pick(GP.filter(i => i != w.i), 40).map(i => sp(D[i].g)[0]))].filter(g => g != w.g).slice(0, 3);
                return sh([{
                    t: w.g,
                    c: 1
                }, ...o.map(t => ({
                    t
                }))])
            };
            const UE = [...new Map(ALL.map(y => [y.e, y])).values()];
            const tr = x => ({
                    k: 'tr',
                    x,
                    o: sh([{
                        t: x.e,
                        c: 1
                    }, ...pick(UE.filter(y => y.e != x.e), 3).map(y => ({
                        t: y.e
                    }))])
                }),
                bd = x => ({
                    k: 'build',
                    x
                });
            if (ws.length >= 4) ex.push({
                k: 'match',
                p: pick(ws, 5)
            });
            pick(ws, 3).forEach(w => ex.push({
                k: 'word',
                w,
                o: gm(w)
            }));
            const t1 = new Map();
            sh(L).forEach((x, i) => {
                t1.set(x, i % 2);
                ex.push(i % 2 ? bd(x) : tr(x))
            });
            sh(L).slice(0, Math.ceil(L.length / 2)).forEach(x => ex.push(t1.get(x) ? tr(x) : bd(x)));
            return ex
        }

        function play(u, l) {
            const U = units()[u];
            if (!U || !U.ls[l]) return course();
            P = {
                u,
                l,
                q: mk(U.ls[l]),
                i: 0,
                h: 5,
                cor: 0,
                st: 'ask',
                sel: null,
                ans: [],
                m: {
                    d: [],
                    s: null,
                    x: null
                }
            };
            draw()
        }
        const hd = () => `<div class="cph"><button class="cx" data-a="quit" aria-label="Quit lesson">✕</button><div class="cpb"><i style="width:${Math.round(P.i/P.q.length*100)}%"></i></div><span class="hr">❤️ ${P.h}</span></div>`;

        function draw() {
            if (P.i >= P.q.length) return fin();
            const x = P.q[P.i],
                fb = P.st == 'fb',
                m = P.m;
            let q = '',
                foot = '';
            if (x.k == 'tr' || x.k == 'word') {
                q = x.k == 'tr' ? `<h3 class="cq">Translate this sentence</h3><div class="gxs">${x.x.s.map(l=>`<div>${esc(l)}</div>`).join('')}</div><div class="gxr">${rom(x.x.r)}</div>` : `<h3 class="cq">What does this word mean?</h3><div class="gxs">${esc(D[x.w.i].s)}</div><div class="gxr"><b>${esc(x.w.w)}</b></div>`;
                q += x.o.map((o, i) => `<button class="opt${P.sel==i?' sel':''}${fb&&o.c?' ok':''}${fb&&P.sel==i&&!o.c?' bad':''}" data-a="opt" data-i="${i}">${esc(o.t)}</button>`).join('')
            } else if (x.k == 'build') {
                x.tiles = x.tiles || sh([...x.x.t, ...pick([...new Set(ALL.flatMap(y => y.t))].filter(t => !x.x.t.map(nz).includes(nz(t))), 2)].map((t, i) => ({
                    i,
                    t
                })));
                q = `<h3 class="cq">Write this in Arusian</h3><div class="cen">“${esc(x.x.e)}”</div><div class="ansb">${P.ans.map(i=>`<button class="tile" data-a="rm" data-i="${i}">${esc(x.tiles.find(t=>t.i==i).t)}</button>`).join('')}</div><div class="bank">${x.tiles.map(t=>P.ans.includes(t.i)?`<span class="tile ghost">${esc(t.t)}</span>`:`<button class="tile" data-a="tile" data-i="${t.i}">${esc(t.t)}</button>`).join('')}</div>`
            } else {
                const p = x.p;
                x.r = x.r || sh(p.map((_, i) => i));
                const c = (side, i) => (m.d.includes(i) ? ' ok' : '') + (m.s && m.s[0] == side && m.s[1] == i ? ' sel' : '') + (m.x && m.x[side == 'l' ? 0 : 1] == i ? ' bad' : '');
                q = `<h3 class="cq">Match the pairs</h3><div class="mg"><div>${p.map((w,i)=>`<button class="opt${c('l',i)}" data-a="ml" data-i="${i}" ${m.d.includes(i)?'disabled':''}>${esc(w.w)}</button>`).join('')}</div><div>${x.r.map(i=>`<button class="opt${c('r',i)}" data-a="mr" data-i="${i}" ${m.d.includes(i)?'disabled':''}>${esc(p[i].g)}</button>`).join('')}</div></div>`;
                if (m.d.length == p.length && !fb) {
                    P.st = 'fb';
                    P.good = 1;
                    return draw()
                }
            }
            if (fb) {
                const ans = x.k == 'tr' ? x.x.e : x.k == 'word' ? x.w.g : x.k == 'build' ? x.x.r : '';
                foot = `<div class="cpf ${P.good?'ok':'bad'}"><b>${P.good?['Correct!','Great job!','Nice!'][P.i%3]:'Correct answer:'}</b>${P.good||!ans?'':`<div>${esc(ans)}</div>`}${x.x?`<div class="gxs2">${x.x.s.map(esc).join(' ')}</div>`:''}<button class="pbtn" data-a="next">Continue</button></div>`
            } else if (x.k != 'match') {
                const ok = x.k == 'build' ? P.ans.length > 0 : P.sel != null;
                foot = `<button class="pbtn" data-a="chk" ${ok?'':'disabled'}>Check</button>`
            }
            app.innerHTML = `<div class="cp">${hd()}<div class="cpq">${q}</div>${foot}</div>`
        }

        function fin() {
            P.st = 'end';
            const xp = 10 + P.cor * 2,
                td = new Date().toLocaleDateString('en-CA');
            CS.done[P.u + '-' + P.l] = 1;
            CS.xp += xp;
            if (CS.last != td) {
                const y = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
                CS.streak = CS.last == y ? CS.streak + 1 : 1;
                CS.last = td
            }
            csSave();
            const U = units(),
                nx = P.l + 1 < U[P.u].ls.length ? `#play-${P.u}-${P.l+1}` : P.u + 1 < U.length ? `#play-${P.u+1}-0` : '#course';
            app.innerHTML = `<div class="cp cen"><div class="big">🎉</div><h2>Lesson complete!</h2><div class="cres"><div><b>+${xp}</b><span>XP</span></div><div><b>${P.h}/5</b><span>Hearts left</span></div><div><b>🔥 ${CS.streak}</b><span>Day streak</span></div></div><a class="pbtn" href="${nx}">Continue</a><a class="lk" href="#course">Back to course</a></div>`
        }

        function fail() {
            P.st = 'end';
            app.innerHTML = `<div class="cp cen"><div class="big">💔</div><h2>Out of hearts</h2><p class="mu">Review the words and try again.</p><button class="pbtn" data-a="again">Try again</button><a class="lk" href="#course">Back to course</a></div>`
        }

        function course() {
            const us = units();
            let cur = null;
            us.forEach((U, ui) => U.ls.forEach((_, li) => {
                if (!cur && !CS.done[ui + '-' + li]) cur = ui + '-' + li
            }));
            app.innerHTML = `<div class="cst"><h2 style="margin:0">Learn Arusian</h2><div><span>🔥 ${CS.streak}</span><span>⭐ ${CS.xp} XP</span></div></div><p class="mu">Short lessons built from real Arusian sentences in the grammar guide: translate sentences, build them word by word and match vocabulary. Tap any word in a sentence for a hint. Progress is saved in this browser.</p>${us.map((U,ui)=>`<section class="cu"><div class="cub"><div><small>Unit ${ui+1}</small><b>${esc(U.t)}</b></div><a href="#g${U.n}">Guide</a></div><div class="cpath">${U.ls.map((_,li)=>{const k=ui+'-'+li,d=CS.done[k];return`<a class="cn${d?' dn':''}${k==cur?' cur':''}" style="transform:translateX(${Math.round(Math.sin(li*1.1)*48)}px)" href="#play-${k}" title="Lesson ${li+1}">${d?'✓':li+1}${k==cur?'<span class="go">START</span>':''}</a>`}).join('')}</div></section>`).join('')}<p style="text-align:center"><button class="lk" data-a="reset">Reset progress</button></p>`
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-a]');
            if (!b) return;
            const a = b.dataset.a,
                i = +b.dataset.i;
            if (a == 'reset') {
                if (b.dataset.c) {
                    CS.xp = 0;
                    CS.streak = 0;
                    CS.last = '';
                    CS.done = {};
                    csSave();
                    course()
                } else {
                    b.dataset.c = 1;
                    b.textContent = 'Click again to erase your progress'
                }
                return
            }
            if (!P) return;
            if (a == 'quit') {
                P = null;
                location.hash = 'course';
                return
            }
            if (a == 'again') {
                play(P.u, P.l);
                return
            }
            const x = P.q[P.i];
            if (P.st == 'fb' && a != 'next' || P.st == 'end') return;
            if (a == 'opt') P.sel = i;
            else if (a == 'tile') P.ans.push(i);
            else if (a == 'rm') P.ans = P.ans.filter(v => v != i);
            else if (a == 'ml' || a == 'mr') {
                const m = P.m,
                    sd = a == 'ml' ? 'l' : 'r';
                m.x = null;
                if (m.s && m.s[0] != sd) {
                    const li = sd == 'l' ? i : m.s[1],
                        ri = sd == 'r' ? i : m.s[1];
                    if (li == ri) m.d.push(li);
                    else m.x = [li, ri];
                    m.s = null
                } else m.s = [sd, i]
            } else if (a == 'chk') {
                const ok = x.k == 'build' ? (r => ALL.some(y => y.e == x.x.e && nz(y.r) == r))(nz(P.ans.map(j => x.tiles.find(t => t.i == j).t).join(' '))) : !!x.o[P.sel].c;
                P.st = 'fb';
                P.good = ok;
                if (!ok) {
                    P.h--;
                    if (!x.rt) P.q.push({
                        ...x,
                        rt: 1,
                        tiles: null,
                        r: null
                    })
                } else if (!x.rt) P.cor++
            } else if (a == 'next') {
                if (P.h <= 0) return fail();
                P.i++;
                P.st = 'ask';
                P.sel = null;
                P.ans = [];
                P.m = {
                    d: [],
                    s: null,
                    x: null
                }
            }
            draw()
        });
        document.addEventListener('keydown', e => {
            if (e.key == 'Enter' && P && location.hash.startsWith('#play') && document.activeElement.tagName != 'BUTTON') {
                const b = $('.pbtn');
                if (b && b.tagName == 'BUTTON' && !b.disabled) b.click()
            }
        });


        // ======== Router & global events ========
        function route() {
            if (!ready) return;
            document.body.className = '';
            tp.hidden = true;
            const h = location.hash.slice(1);
            more = 60;
            const hs = $('#hs');
            if (hs) hs.value = '';
            if (/^w\d+$/.test(h)) entry(+h.slice(1));
            else if (h == 'browse') browse('a');
            else if (h.startsWith('letter-')) browse(h.slice(7));
            else if (h == 'notation') notation();
            else if (h == 'course') course();
            else if (/^play-\d+-\d+$/.test(h)) {
                const m = h.split('-');
                play(+m[1], +m[2])
            } else if (h == 'grammar') gram();
            else if (/^g\d+$/.test(h)) lesson(+h.slice(1));
            else home();
            window.scrollTo(0, 0)
        }

        document.addEventListener('input', e => {
            const t = e.target;
            if (t.id != 'hs' && t.id != 'hq') return;
            const v = t.value;
            more = 60;
            if (t.id == 'hq') $('#hs').value = v;
            else if ($('#hq')) $('#hq').value = v;
            search(v)
        });
        document.addEventListener('click', e => {
            const j = e.target.closest('[data-j]');
            if (j) {
                const el = document.getElementById(j.dataset.j);
                if (el) el.scrollIntoView({
                    behavior: 'smooth'
                });
                return
            }
            const a = e.target.closest('a[href^="#w"]');
            if (a && a.getAttribute('href') == location.hash) setTimeout(route);
            const b = e.target.closest('.tk');
            document.querySelectorAll('.tk.on').forEach(x => x.classList.remove('on'));
            if (!b) {
                if (!e.target.closest('#tp')) tp.hidden = true;
                return
            }
            b.classList.add('on');
            const g = look(b.dataset.t);
            let h = `<b>${esc(b.textContent.replace(/^[\[(]+|[\])\.?!,]+$/g,''))}</b>`;
            if (!g.length) h += '<div class="mu" style="margin-top:6px">No separate dictionary entry for this form.</div>';
            g.forEach(x => {
                if (g.length > 1) h += `<div class="pl">${esc(x.l)}</div>`;
                x.ids.forEach(i => {
                    const d = D[i];
                    h += `<a class="pe ${kc(d)}" href="#w${i}"><span class="pw">${esc(d.w)}</span> ${bd(d)}<br>${esc(d.g)}</a>`
                })
            });
            tp.innerHTML = h;
            tp.hidden = false;
            const r = b.getBoundingClientRect();
            tp.style.top = (r.bottom + scrollY + 8) + 'px';
            tp.style.left = Math.max(10, Math.min(r.left + scrollX, document.documentElement.clientWidth - tp.offsetWidth - 10)) + 'px'
        });
        document.addEventListener('keydown', e => {
            if (e.key == 'Escape') tp.hidden = true
        });

        addEventListener('hashchange', route);

        // ======== Boot ========
        // ---- boot: fetch data from API, then build indexes and render ----
        async function boot() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const raw = await res.json();
                D = raw.map(adapt);
                buildIndexes();
                buildUsedIndex();
                buildFcount();
                ready = true;
                route();
            } catch (err) {
                console.error(err);
                app.innerHTML = `<div style="text-align:center;padding:60px 16px;color:var(--mu)">
                    <div style="font:normal 3rem/1 Buwagat;color:var(--ac);margin-bottom:16px">Bet auM</div>
                    <p>Could not load the dictionary.</p>
                    <p style="font-size:.85rem">${esc(err.message)}</p>
                    <button class="more" onclick="location.reload()">Retry</button>
                </div>`;
            }
        }

        boot();


        // ---- theme toggle ----
        (function () {
            const r = document.documentElement, b = document.getElementById('th');
            try { const t = localStorage.getItem('theme'); if (t) r.dataset.theme = t } catch (e) { }
            b.addEventListener('click', () => {
                const dark = r.dataset.theme ? r.dataset.theme == 'dark' : matchMedia('(prefers-color-scheme:dark)').matches,
                    n = dark ? 'light' : 'dark';
                r.dataset.theme = n;
                try { localStorage.setItem('theme', n) } catch (e) { }
            })
        })();

    </script>

    <style>
    @font-face {
        font-family: Buwagat;
        src: url('https://thearusianlanguage.vercel.app/fonts/Buwagat2.ttf') format('truetype');

    nav a:hover {
        color: var(--ac);
        text-decoration: none;
    }

    .hs {
        flex: 1 1 220px;
        max-width: 260px;
        margin-left: auto;
    }

    #th {
        background: none;
        border: 0;
        color: var(--ink);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        display: flex;
    }

    #th:hover {
        background: var(--bg2);
    }

    /* ---- Search input ---- */

    input[type=search] {
        width: 100%;
        padding: 9px 14px;
        border: 1px solid var(--ln);
        border-radius: 99px;
        background: var(--bg2);
        color: var(--ink);
        font: inherit;
        outline: none;
    }

    input[type=search]:focus {
        border-color: var(--ac);
    }

    /* ---- Layout & hero ---- */

    main {
        max-width: 1000px;
        margin: auto;
        padding: 20px 16px 56px;
    }

    .hero {
        background: linear-gradient(135deg, var(--ac2), var(--bg2));
        border: 1px solid var(--ln);
        border-radius: 18px;
        padding: 36px 22px;
        text-align: center;
    }

    .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(1.7rem, 5vw, 2.5rem);
        line-height: 1.15;
    }

    .hero p {
        margin: 0 auto 20px;
        max-width: 560px;
        color: var(--mu);
    }

    .hero input {
        max-width: 560px;
        padding: 15px 22px;
        font-size: 1.1rem;
        box-shadow: var(--sh);
    }

    .hscript {
        font: clamp(3.4rem, 11vw, 5.6rem)/1.15 Buwagat;
        font-variant-ligatures: common-ligatures;
        color: #fff;
        white-space: pre-wrap;
    }

    .btn {
        display: table;
        margin: 22px auto 0;
        padding: 15px 40px;
        border-radius: 8px;
        background: #e9ecef;
        color: #1a1a1a;
        font-weight: 700;
        font-size: 1.15rem;
    }

    .btn:hover {
        background: #fff;
        text-decoration: none;
    }

    .st {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin-top: 22px;
        flex-wrap: wrap;
    }

    .st b {
        display: block;
        font-size: 1.6rem;
        color: var(--ac);
    }

    .st span {
        font-size: .8rem;
        color: var(--mu);
        text-transform: uppercase;
        letter-spacing: .06em;
    }

    /* ---- Home page sections ---- */

    h2 {
        font-size: 1.2rem;
        margin: 34px 0 12px;
    }

    .ft {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
    }

    .card,
    .ft div {
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 16px;
        background: var(--bg);
    }

    .ft b {
        display: block;
        margin-bottom: 4px;
    }

    .ft span {
        color: var(--mu);
        font-size: .92rem;
    }

    .pop {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
    }

    .pc {
        display: block;
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 12px 14px;
        color: var(--ink);
    }

    .pc:hover {
        border-color: var(--ac);
        text-decoration: none;
        box-shadow: var(--sh);
    }

    .pc .sc {
        display: block;
        font: 1.9rem/1.2 Buwagat;
        color: var(--c, var(--ink));
    }

    .pc b {
        font-size: 1.05rem;
        color: var(--c, var(--ink));
    }

    .pc small {
        display: block;
        color: var(--cgr);
    }

    /* ---- Entry colour classes (Muwa-Tep notation) ---- */

    .k-r {
        --c: var(--cr);
    }

    .k-b {
        --c: var(--cb);
    }

    .k-g {
        --c: var(--cg);
    }

    .k-p {
        --c: var(--cp);
    }

    .k-k {
        --c: var(--ink);
    }

    /* ---- A–Z bar ---- */

    .az {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .az a {
        min-width: 36px;
        text-align: center;
        padding: 6px 10px;
        border: 1px solid var(--ln);
        border-radius: 8px;
        font-weight: 700;
    }

    .az a.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
    }

    /* ---- Word rows & badges ---- */

    .rr {
        display: grid;
        grid-template-columns: minmax(70px, 150px) 1fr;
        gap: 4px 14px;
        padding: 12px 4px;
        border-bottom: 1px solid var(--ln);
        color: var(--ink);
        align-items: center;
    }

    .rr:hover {
        background: var(--bg2);
        text-decoration: none;
    }

    .rs {
        font: 1.5rem/1.2 Buwagat;
        color: var(--c, var(--ink));
        overflow-wrap: anywhere;
    }

    .rw {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--c, var(--ink));
    }

    .rg {
        color: var(--cgr);
        display: block;
    }

    .or {
        font: 700 .42em system-ui, sans-serif;
        letter-spacing: .08em;
        color: var(--mu);
        margin: 0 .9em;
        vertical-align: middle;
    }

    .bd {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 9px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--c, var(--ac)) 14%, transparent);
        color: var(--c, var(--ac));
        font-size: .72rem;
        font-weight: 700;
        vertical-align: middle;
        white-space: nowrap;
    }

    /* ---- Entry page ---- */

    .crumb {
        font-size: .9rem;
        display: inline-block;
        margin-bottom: 12px;
    }

    .eh {
        border: 1px solid var(--ln);
        border-radius: 18px;
        padding: 22px;
        background: var(--bg2);
    }

    .scr {
        font: clamp(2.4rem, 9vw, 3.6rem)/1.2 Buwagat;
        color: var(--c, var(--ink));
        overflow-wrap: anywhere;
    }

    .eh h1 {
        margin: 2px 0 8px;
        font-size: 2rem;
        color: var(--c, var(--ink));
    }

    .gl {
        margin: 6px 0 0;
        font-size: 1.1rem;
        color: var(--cgr);
    }

    .meta {
        margin-top: 14px;
        font-size: .9rem;
        color: var(--mu);
        display: flex;
        gap: 6px 22px;
        flex-wrap: wrap;
    }

    .sn {
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 12px;
    }

    .sc2 {
        font: 1.8rem/1.35 Buwagat;
        color: var(--cy);
        overflow-wrap: anywhere;
    }

    .sr {
        margin: 8px 0 4px;
        font-size: 1.12rem;
        font-style: italic;
        color: var(--cy);
    }

    /* ---- Example sentences, word tokens & word family ---- */

    .tk {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        border-bottom: 2px dotted var(--ac);
        padding: 0 1px;
        margin: 0 1px;
        cursor: pointer;
        border-radius: 3px;
    }

    .tk:hover,
    .tk.on {
        background: var(--hi);
    }

    .se {
        color: var(--cgr);
    }

    .lab {
        font-size: .78rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--mu);
        margin: 16px 0 8px;
        font-weight: 700;
    }

    .fam {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 8px;
        max-height: 560px;
        overflow: auto;
    }

    .fam a {
        display: block;
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 8px 12px;
        color: var(--ink);
    }

    .fam a.cur {
        border-color: var(--ac);
        background: var(--ac2);
    }

    .fam a:hover {
        text-decoration: none;
        border-color: var(--ac);
    }

    .fam small {
        display: block;
        color: var(--cgr);
    }

    .fam b {
        color: var(--c, var(--ink));
    }

    /* ---- Word popup (tap a word) ---- */

    #tp {
        position: absolute;
        z-index: 60;
        width: min(320px, calc(100vw - 20px));
        background: var(--bg);
        border: 1px solid var(--ac);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
    }

    #tp[hidden] {
        display: none;
    }

    #tp>b {
        font-size: 1.1rem;
    }

    #tp .pe {
        display: block;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--ln);
        color: var(--ink);
    }

    #tp .pe:hover {
        text-decoration: none;
    }

    #tp .pw {
        font-weight: 700;
        color: var(--c, var(--ac));
    }

    #tp .pl {
        margin-top: 8px;
        font-size: .78rem;
        color: var(--mu);
        text-transform: uppercase;
    }

    /* ---- Utilities, footer & buttons ---- */

    .mu {
        color: var(--mu);
    }

    .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px 14px;
        align-items: center;
    }

    .sw {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: inline-block;
    }

    footer {
        border-top: 1px solid var(--ln);
        padding: 22px 16px;
        text-align: center;
        color: var(--mu);
        font-size: .85rem;
    }

    button.more {
        margin: 16px auto;
        display: block;
        padding: 10px 22px;
        border-radius: 99px;
        border: 1px solid var(--ac);
        background: none;
        color: var(--ac);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    /* ---- Grammar guide ---- */

    .gxl {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 12px;
    }

    .gxc {
        display: flex;
        gap: 14px;
        align-items: center;
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 12px 14px;
        color: var(--ink);
    }

    .gxc:hover {
        border-color: var(--ac);
        text-decoration: none;
        box-shadow: var(--sh);
    }

    .gxn {
        font: 800 1.6rem/1 system-ui;
        color: var(--ac);
        min-width: 2ch;
        text-align: center;
    }

    .gxb {
        max-width: 780px;
    }

    .gxb p {
        line-height: 1.7;
        margin: 12px 0;
    }

    .gxh {
        margin: 32px 0 10px;
        font-size: 1.3rem;
        color: var(--ac);
        scroll-margin-top: 90px;
    }

    .gxf {
        text-align: center;
        font-style: italic;
        font-size: 1.25rem;
        background: var(--bg2);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 12px;
        margin: 14px 0;
    }

    .gxk {
        text-align: center;
        margin: 8px 0;
    }

    .gxe {
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 14px 16px;
        margin: 14px 0;
        background: var(--bg);
    }

    .gxm {
        font-size: .75rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--mu);
        font-weight: 700;
        margin-bottom: 6px;
    }

    .gxs {
        font: 1.8rem/1.35 Buwagat;
        color: var(--ink);
        overflow-wrap: anywhere;
    }

    .gxs2 {
        font: 1.45rem/1.3 Buwagat;
        color: var(--ink);
        overflow-wrap: anywhere;
    }

    .gxr {
        font-style: italic;
        font-size: 1.1rem;
        margin: 6px 0 2px;
    }

    .gxg {
        font-size: .85rem;
        font-style: italic;
        color: var(--mu);
    }

    .gxt {
        margin-top: 4px;
    }

    .gxsub {
        font-weight: 700;
        font-style: italic;
        margin-bottom: 4px;
    }

    .gxtree {
        margin: 18px 0;
        overflow-x: auto;
        padding-bottom: 8px;
    }

    .gxtree ul {
        display: flex;
        justify-content: center;
        list-style: none;
        margin: 0;
        padding: 22px 0 0;
        position: relative;
        width: max-content;
        min-width: 100%;
    }

    .gxtree>ul {
        padding-top: 0;
    }

    .gxtree ul ul::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        height: 22px;
        border-left: 2px solid var(--ac);
    }

    .gxtree li {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        padding: 22px 7px 0;
    }

    .gxtree li::before,
    .gxtree li::after {
        content: "";
        position: absolute;
        top: 0;
        right: 50%;
        width: 50%;
        height: 22px;
        border-top: 2px solid var(--ac);
    }

    .gxtree li::after {
        right: auto;
        left: 50%;
        border-left: 2px solid var(--ac);
    }

    .gxtree li:only-child {
        padding-top: 0;
    }

    .gxtree li:only-child::before,
    .gxtree li:only-child::after {
        display: none;
    }

    .gxtree li:first-child::before,
    .gxtree li:last-child::after {
        border: 0;
    }

    .gxtree li:last-child::before {
        border-right: 2px solid var(--ac);
        border-radius: 0 8px 0 0;
    }

    .gxtree li:first-child::after {
        border-radius: 8px 0 0 0;
    }

    .gxtree>ul>li {
        padding-top: 0;
    }

    .gxtree>ul>li::before,
    .gxtree>ul>li::after {
        display: none;
    }

    .gxnode {
        border: 1.5px solid var(--ac);
        background: var(--ac2);
        border-radius: 12px;
        padding: 6px 12px;
        text-align: center;
        min-width: 108px;
        box-shadow: 2px 3px 0 var(--ln);
        position: relative;
        z-index: 1;
    }

    .gxnode .gxs2 {
        font-size: 1.3rem;
    }

    .gxnode .gxr {
        margin: 2px 0;
        font-size: 1rem;
    }

    .gxnode .gxg {
        font-size: .78rem;
    }

    .gxw {
        overflow-x: auto;
        margin: 16px 0;
    }

    .gxw table {
        border-collapse: collapse;
        min-width: 100%;
    }

    .gxw td,
    .gxw th {
        border: 1px solid var(--ln);
        padding: 8px 10px;
        text-align: center;
        vertical-align: top;
    }

    .gxw th {
        background: var(--bg2);
    }

    .gxcap {
        display: flex;
        gap: 10px;
        align-items: baseline;
        justify-content: center;
        font-size: 1.1rem;
        margin-bottom: 6px;
    }

    .jump {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
    }

    .jump button {
        font: inherit;
        font-size: .82rem;
        padding: 4px 12px;
        border-radius: 99px;
        border: 1px solid var(--ln);
        background: var(--bg);
        color: var(--ink);
        cursor: pointer;
    }

    .jump button:hover {
        border-color: var(--ac);
        color: var(--ac);
    }

    .gnav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 34px;
        flex-wrap: wrap;
    }

    .gnav a {
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 10px 14px;
    }

    /* ---- Course (game-style lessons) ---- */

    .cst {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .cst span {
        margin-left: 14px;
        font-weight: 800;
    }

    .cu {
        margin: 26px 0;
    }

    .cub {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--ac);
        color: var(--bg);
        border-radius: 16px;
        padding: 12px 18px;
    }

    .cub small {
        display: block;
        opacity: .8;
        text-transform: uppercase;
        letter-spacing: .06em;
        font-size: .72rem;
    }

    .cub a {
        color: var(--bg);
        border: 2px solid var(--bg);
        border-radius: 12px;
        padding: 4px 12px;
        font-weight: 700;
    }

    .cpath {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 26px 0 8px;
    }

    .cn {
        position: relative;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 1.5rem;
        background: var(--ac);
        color: var(--bg);
        box-shadow: 0 6px 0 rgba(0, 0, 0, .3);
    }

    .cn:hover {
        text-decoration: none;
        filter: brightness(1.1);
    }

    .cn.dn {
        background: #58a700;
        color: #fff;
    }

    .cn.cur {
        outline: 5px solid var(--ac2);
        outline-offset: 4px;
    }

    .go {
        position: absolute;
        top: -32px;
        background: var(--bg);
        color: var(--ac);
        border: 2px solid var(--ac);
        border-radius: 10px;
        padding: 1px 10px;
        font-size: .72rem;
        letter-spacing: .06em;
    }

    .cp {
        max-width: 640px;
        margin: 0 auto;
    }

    .cph {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
    }

    .cx {
        background: none;
        border: 0;
        font-size: 1.4rem;
        color: var(--mu);
        cursor: pointer;
    }

    .cpb {
        flex: 1;
        height: 14px;
        border-radius: 99px;
        background: var(--ln);
        overflow: hidden;
    }

    .cpb i {
        display: block;
        height: 100%;
        background: #58a700;
        border-radius: 99px;
        transition: width .3s;
    }

    .hr {
        font-weight: 800;
        color: #ea2b2b;
    }

    .cq {
        margin: 0 0 14px;
        font-size: 1.35rem;
    }

    .cen {
        text-align: center;
    }

    .opt {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        margin: 9px 0;
        border: 2px solid var(--ln);
        border-bottom-width: 4px;
        border-radius: 14px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
    }

    .opt:hover {
        background: var(--bg2);
    }

    .opt.sel {
        border-color: var(--ac);
        background: var(--ac2);
    }

    .opt.ok {
        border-color: #58a700;
        background: rgba(88, 167, 0, .2);
    }

    .opt.bad {
        border-color: #ea2b2b;
        background: rgba(234, 43, 43, .16);
    }

    .opt:disabled {
        cursor: default;
    }

    .mg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .ansb {
        min-height: 62px;
        border-bottom: 2px solid var(--ln);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 0;
        margin: 14px 0;
    }

    .bank {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin: 18px 0;
    }

    .tile {
        font: inherit;
        padding: 8px 14px;
        border: 2px solid var(--ln);
        border-bottom-width: 4px;
        border-radius: 12px;
        background: var(--bg);
        color: var(--ink);
        cursor: pointer;
    }

    .tile.ghost {
        background: var(--ln);
        color: transparent;
        border-color: var(--ln);
        cursor: default;
    }

    .pbtn {
        display: block;
        width: 100%;
        margin-top: 18px;
        padding: 13px;
        border: 0;
        border-bottom: 4px solid #3d7500;
        border-radius: 14px;
        background: #58a700;
        color: #fff;
        font: inherit;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
        text-align: center;
        cursor: pointer;
    }

    .pbtn:hover {
        text-decoration: none;
        filter: brightness(1.07);
    }

    .pbtn:disabled {
        background: var(--ln);
        border-color: var(--mu);
        color: var(--mu);
        cursor: default;
    }

    .cpf {
        margin-top: 22px;
        padding: 16px;
        border-radius: 16px;
    }

    .cpf.ok {
        background: rgba(88, 167, 0, .18);
    }

    .cpf.bad {
        background: rgba(234, 43, 43, .15);
    }

    .cpf .pbtn {
        margin-top: 12px;
    }

    .cpf.bad .pbtn {
        background: #ea2b2b;
        border-color: #a81818;
    }

    .big {
        font-size: 4rem;
    }

    .cres {
        display: flex;
        justify-content: center;
        gap: 26px;
        margin: 18px 0;
    }

    .cres b {
        display: block;
        font-size: 1.6rem;
        color: var(--ac);
    }

    .cres span {
        font-size: .78rem;
        text-transform: uppercase;
        color: var(--mu);
    }

    .lk {
        background: none;
        border: 0;
        color: var(--mu);
        text-decoration: underline;
        cursor: pointer;
        font: inherit;
    }

    /* ---- Home page (full-bleed hero) overrides ---- */

    body.home {
        background: var(--hero);
