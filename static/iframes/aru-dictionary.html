/i> translates to the same thing but adds emphasis on the plural, indicating many people."}]},
            {"n":3,"t":"Topic-Comment Syntax","r":"Puwauwei-Deg","s":"med ,auauP","b":[{"k":"h","t":"Syntax"},{"k":"p","h":"Arusian grammar is different from English grammar, as this system is likely unique to Arusian. Arusian builds sentences using an elaborate topic- comment system known as <i>Puwauwei-deg</i> ."},{"k":"p","h":"The topic is what the sentence is about, or in other words, it is the focus of the sentence, and it must always come at the beginning of every sentence. The topic is then described by comments placed after it. Comments can be single words or phrases that provide information about the topic. To start with the basics, here is the formula for building any Arusian sentence, represented by the diagram below. In the diagram, the topic is inside brackets, and the comment is in parentheses."},{"k":"f","t":"[Topic] (comment)"},{"k":"p","h":"Using Arusian syntax, to say, <i>The house is beautiful,</i> we would construct the sentence as such as shown in example 3.1."},{"k":"e","n":"Example 3.1","sub":[],"s":["s,,aeaua seM"],"r":"[mes] (auwayeis)","g":"[house] (being.beautiful-LINK)","p":[],"e":"A/The house is beautiful."},{"k":"p","h":"In Example 3.1, the topic &#x27;house&#x27; is being described by the comment (or predicate) <i>auwayeis</i> . The comment is composed of the patient noun <i>auwayei</i> , and it is marked by the affix <i>-s</i> , indicating that it is the comment of &#x27;house.&#x27; It is important to note that there are no adjectives in Arusian. Instead, patient, agent, or root nouns act like adjectives when placed inside comments, as they describe the topics. It is also possible to reverse the elements in the sentence (see Example 3.2)."},{"k":"e","n":"Example 3.2","sub":[],"s":["seM as ,,aeaua"],"r":"[auwayei] (sa mes)","g":"[being.beautiful] (LINK house)","p":[],"e":"A/The house is beautiful."},{"k":"p","h":"In Example 3.2, we can see that the words from Example 1 have been reversed, with <i>auwayei</i> as the topic and sa <i>mes</i> as the comment. By doing this, the focus shifts to <i>auwayei</i> since it is now the topic."},{"k":"e","n":"Example 3.3","sub":[],"s":["m,et as seM"],"r":"[mes] (sa tim)","g":"[house] (LINK blackness)","p":[],"e":"A/The house is black."},{"k":"p","h":"In Example 3.3, we have the comment <i>sa tim</i> , where <i>tim</i> is the root in the comment. Because the root <i>tim</i> ends in a consonant, the marker <i>sa</i> is placed in front of the root since roots ending in consonants cannot be inflected with the comment affix <i>-s</i> ."},{"k":"p","h":"A general rule when forming comments is that if the root in the comment ends in a consonant OR the comment contains more than one root, the marker <i>sa</i> must be used in which it is placed at the beginning of the comment like in <i>mes sa tim</i> where, <i>sa tim</i> is the comment. When a comment however has a single root that ends in a vowel sound, the suffix <i>-s</i> must be used in which <i>-s</i> is suffixed onto the comment root like in <i>mes auwayeis</i> , where <i>auwayeis</i> is the comment and <i>auwayei</i> is its root."},{"k":"p","h":"<b>GRAMMAR TIP</b> <i>: sa/-s only connects nouns to other nouns.</i>"},{"k":"h","t":"The Plural Marker"},{"k":"p","h":"To specify if a word is plural, one can add the marker, <i>pei</i> after the root it pluralizes. Unlike English, the plural marker is optional, and plurality is indicated most of the time by context."},{"k":"e","n":"Example 3.4","sub":[],"s":[",aP auj  ."],"r":"juwa-pei","g":"book-PLURAL","p":[],"e":"Books."},{"k":"p","h":"In Example 3.4, the root <i>juwa</i> is attached to the plural marker <i>pei</i> . The plural"},{"k":"p","h":"marker <i>pei</i> must always come after the word that it pluralizes."},{"k":"h","t":"Multiple Elements in a Comment"},{"k":"p","h":"What if I want to say, &#x27;The house is big and beautiful&#x27;? To express this, we would say the following in Example 3.5 below."},{"k":"e","n":"Example 3.5","sub":[],"s":[",aeaua aso umu as seM"],"r":"[mes] (sa umu osa auwayei)","g":"[house] (LINK bigness and being.beautiful)","p":[],"e":"A/The house is big and beautiful."},{"k":"p","h":"In Example 3.5, the topic <i>house</i> is described by a comment with the two words <i>bigness</i> and <i>being beautiful</i> . In the comment, the two words are separated by the conjunction <i>osa</i> . Any number of words can be included in the comment, and all must be separated by the conjunction <i>osa</i> ."},{"k":"h","t":"Intensify Words"},{"k":"p","h":"To say, <i>The house is very black</i> we could say the following example below."},{"k":"e","n":"Example 3.6","sub":[],"s":["m,et as m,et as seM"],"r":"[mes] (sa tim sa tim)","g":"[house] (LINK blackness LINK blackness)","p":[],"e":"A/The house is very black."},{"k":"p","h":"To express the concept of intensity, you repeat the comment within the comment. In the above sentence, we have the comment <i>sa tim</i> being commented on by itself. It can be confusing for some to understand the functions of the <i>-s</i> and <i>sa</i> markers. If you are confused by this, you can think of <i>sa</i> or <i>-s</i> as meaning &#x27;in which,&#x27; as they function in a similar way. Another way to express the concept of &#x27;very&#x27; is by using the root <i>otra</i> . We can see this being used in Example 3.7 shown below."},{"k":"e","n":"Example 3.7","sub":[],"s":["sarTo m,et as seM"],"r":"[mes] (sa tim otras)","g":"[house] (LINK blackness many-LINK)","p":[],"e":"A/The house is very black."},{"k":"p","h":"Like the previous example, we have the comment <i>otras</i> being commented on by <i>sa tim</i> (another comment). Comments can have their own comments describing them while also describing the topic. To demonstrate this further, let us take the contents of the comment from the above example and make it its own sentence."},{"k":"e","n":"Example 3.8","sub":[],"s":["sarlt m,et"],"r":"[tim] (tlras)","g":"[blackness] (acting.amazing-LINK)","p":[],"e":"Very black."},{"k":"p","h":"As we can see above, <i>tim</i> , meaning &#x27;blackness,&#x27; is the topic, and <i>tlras</i> is the comment. <i>Tlras</i> is another word one can use to intensify a word."},{"k":"h","t":"Usage of Intransitive Verbs"},{"k":"p","h":"Intransitive verbs are verbs that do not have an object. Intransitive verbs are a little weird as they are syntactically nouns, but are semantically verbs. In other words, Intransitive verbs in Arusian behave just like nouns do, but they carry the meaning that verbs do. Here are a few examples below"},{"k":"e","n":"Example 3.9","sub":[],"s":["sauad ul"],"r":"[lu] (dauwas)","g":"[1] (eating-LINK)","p":[],"e":"I eat."},{"k":"p","h":"In Example 3.9, <i>dauwa</i> is an intransitve actor verb. The word <i>dauwa</i> , translating to &#x27;the act of eating,&#x27; is commented on with the topic <i>lu</i> ."},{"k":"e","n":"Example 3.10","sub":[],"s":["s,auad lev oaN"],"r":"[nau-vel] (dauweis)","g":"[apple] (being.eaten-LINK)","p":[],"e":"An/The apple is eaten."},{"k":"p","h":"In Example 3.10, <i>dauwei</i> is an intransitive patient verb. The word <i>dauwei</i> , translating to &#x27;being eaten,&#x27; is commented on with the topic <i>nau-vel</i> <i>(apple)</i> ."},{"k":"h","t":"Usage of Transitive Verbs"},{"k":"e","n":"Example 3.11","sub":[],"s":["roa ul as seM"],"r":"[mes] (sa lu auwr)","g":"[house] (LINK 1 see)","p":[],"e":"I see a/the house."},{"k":"p","h":"In Example 3.11, <i>auwa</i> is the transitive verb. We have the clause <i>lu auwr</i> (I see) inside the comment, and since <i>auwr</i> is transitive, it is assumed that <i>mes</i> is the object."},{"k":"e","n":"Example 3.12","sub":[],"s":[",r soa seM as ul"],"r":"[lu] (sa mes ause)","g":"[1] (LINK house seen.by)","p":[],"e":"An/The house is seen by me."},{"k":"p","h":"Example 3.12 is the same as Example 3.11, except the patient transitive verb <i>ause</i> is used instead. <i>Ause</i> is the transitive verb, <i>mes</i> is the subject, and <i>lu</i> is the object. Because a transitive verb is in the comment of the topic, this implies that the topic is the object of the sentence. This implies the following:"},{"k":"f","t":"[TOPIC] (COMMENT)"},{"k":"f","t":"[Object] (Subject Verb)"},{"k":"p","h":"When the object is made the topic of the sentence, an OSV word order is used. One can also make the subject the topic in an SVO word order, which will be discussed later in this chapter."},{"k":"h","t":"Usage of Irregular Verbs"},{"k":"e","n":"Example 3.13","sub":[],"s":["sarGert ul"],"r":"[lu] (tregras)","g":"[1] (go.toward-LINK)","p":[],"e":"I go."},{"k":"e","n":"Example 3.14","sub":[],"s":["cet ,aaP rM us"],"r":"[su] (mr pai-tek)","g":"[3] (leave school)","p":[],"e":"He/She/It leaves school."},{"k":"p","h":"Examples 3.13 and 3.14 use the irregular verbs . What makes these verbs irregular is that their roots, <i>treg</i> and <i>mreg</i> , change form when turned into verbs, unlike all other verbs, which use inflective markers."},{"k":"h","t":"Usage of Topic Resumptive Pronouns"},{"k":"p","h":"There are two types of resumptive pronouns in Arusian. There is <i>u</i> , the topical resumptive pronoun, and <i>wei</i> , the comment resumptive pronoun, in which both loosely translate to “that” in English. The topical resumptive pronoun refers to topic clauses and links to a verb or comment. The comment resumptive pronoun refers to comment clauses and links to a verb or comment. Here are some examples using the topical resumptive pronoun, as shown in Example 3.15."},{"k":"e","n":"Example 3.15","sub":[],"s":["s,ab u roa ul as seM"],"r":"[mes sa lu auwr] u (beis)","g":"[house LINK 1 see] RES.TOPIC (goodness-LINK)","p":[],"e":"The house that I see is good."},{"k":"e","n":"Example 3.16","sub":[],"s":["s,ab u ,r soa seM as ul"],"r":"[lu sa mes ause] u (beis)","g":"[1 LINK house seen] RES.TOPIC (goodness-LINK)","p":[],"e":"It is good that I see the house."},{"k":"e","n":"Example 3.17","sub":[],"s":["roa ul as u m,et as seM"],"r":"[mes sa tim] u (sa lu auwr)","g":"[house LINK blackness] RES.TOPIC (LINK 1 see)","p":[],"e":"I see a/the black house."},{"k":"e","n":"Example 3.18","sub":[],"s":["sul u m,et as seM"],"r":"[mes sa tim] u (lus)","g":"[house LINK blackness] RES.TOPIC (1-LINK)","p":[],"e":"The black house is mine."},{"k":"p","h":"In the examples above, <i>u</i> is refering to the topic clause <i>mes sa tim</i> and is linking to the comment <i>lus</i> that describes it."},{"k":"h","t":"Usage of Comment Resumptive Pronouns"},{"k":"p","h":"Now that we have gone over the topical resumptive pronoun, let us discuss the comment resumptive pronoun. The comment resumptive pronoun has the same function as the topical resumptive pronoun. The only difference is that the comment resumptive pronoun refers to comment clauses and links to comments or verbs. See examples below."},{"k":"e","n":"Example 3.19","sub":[],"s":["roa ,au sarTo m.ov as seM"],"r":"[mes] (sa vom otras wei auwr )","g":"[house] (LINK person many-LINK COM see)","p":[],"e":"Many people see a/the house."},{"k":"p","h":"In Example 3.19, the comment resumptive pronoun <i>wei</i> is refering to the clause <i>vom otras</i> and linking to the verb, <i>auwr</i> . Here are both the topical and comment resumptive pronouns used in a single sentence, as shown in Example 3.20."},{"k":"e","n":"Example 3.20","sub":[],"s":["roa ,au sarTo m.ov as u m,et as seM"],"r":"[mes sa tim] u (sa vom otras wei auwr)","g":"[house LINK blackness] RES.TOPIC (LINK person many-LINK RES.COMMENT see)","p":[],"e":"Many people see a/the black house."},{"k":"p","h":"In Example 3.20, we have the topic clause, <i>mes sa tim</i> (black house) refered to by <i>u</i> . <i>U</i> has the comment <i>sa vom otras</i> (many people). <i>Wei</i> then refers to the clause <i>vom otras</i> and has the the verb, <i>auwr</i> (to see)."},{"k":"h","t":"Usage of Indirect Resumptive Pronouns"},{"k":"p","h":"One can use the resumptive pronoun <i>wei-wei</i> to refer to indirect comments. See example below."},{"k":"e","n":"Example 3.21","sub":[],"s":["rmak ,au ,au sul cul ruo ul as cet"],"r":"[tek] (sa lu ouwr luk lus wei wei kamr)","g":"[education] (LINK 1 want child 1-LINK RES.INDIRECT have)","p":[],"e":"I want my child to have an education."},{"k":"p","h":"In example 3.21, the clause <i>luk lus</i> is the indirect clause inside the whole comment clause <i>lu ouwr luk lus</i> . The indirect clause is refered to by <i>wei-wei</i> which is linked to the verb <i>kamr</i> (to have), indicating that <i>luk lus</i> , is doing the verb <i>kamr</i> . Thus, to link an indirect comment clause to a verb or comment, one must use <i>wei-wei</i> ."},{"k":"p","h":"The indirect resumptive pronoun is usually used in formal context and writing. It is common to use comment conjuctions used in place of indirect conjunctions in everyday conversation."},{"k":"h","t":"Subject-Verb-Object Word Order"},{"k":"p","h":"Previously, we learned about <i>Puwauwei-deg</i> , a topic-comment syntax that is commonly used in everyday life. In transitive sentences (in sentences where the verb acts on an object), we saw that the word order in those examples was OSV, in which the object was the topic of the sentence. However, this is not the only way to organize transitive sentences. One can use Subject-Verb-Object (SVO) word order, in which the subject is the topic of the sentence."},{"k":"f","t":"[TOPIC] (COMMENT)"},{"k":"f","t":"[Subject] (Verb Object)"},{"k":"p","h":"As we can see, this is exactly how English orders its sentences. Notice that in this word order, the subject is the topic, and the comment is everything that follows. Below is an example of the sentence &#x27;I eat a banana&#x27; in Arusian, as shown in Example 3.22."},{"k":"e","n":"Example 3.22","sub":[],"s":["oaN uj road ul"],"r":"[Lu] (dauwr ju-nau)","g":"[1] (eat banana)","p":[],"e":"I eat a/the banana."},{"k":"p","h":"As shown above, <i>lu</i> , meaning &#x27;I,&#x27; is the subject of the sentence, <i>dauwr</i> (to eat) is the transitive verb, and <i>ju-nau</i> is the object. Notice how the comment in the above example does not start with the comment marker <i>sa</i> . This is because, in SVO word order, the transitive verb acts like a comment marker, as it begins the description of the topic."},{"k":"h","t":"Adverbs"},{"k":"p","h":"Adverbs are formed with the linker <i>sasa</i> , and any root after it. Adverbs must always go after the object and verb in the sentence. The adverb linker <i>sasa</i> describes verbs and comment. Here are some examples."},{"k":"e","n":"Example 3.23","sub":[],"s":["ut as as oaN uj road us"],"r":"[su] (dauwr ju-nau sasa tu)","g":"[3] (eat banana ADV fast)","p":[],"e":"He/She is eating a/the banana quickly."},{"k":"e","n":"Example 3.24","sub":[],"s":["ut as as sumu hoaN uj road us"],"r":"[su] (dauwr ju-nau umus sasa tu)","g":"[3] (eat banana hugeness-LINK ADV fast)","p":[],"e":"He/She is eating a/the huge banana quickly."},{"k":"e","n":"Example 3.25","sub":[],"s":["ut as as road os as hoaN uj  ."],"r":"[ju-nau] (sa so dauwr sasa tu)","g":"[banana] (of It/He/She eat ADVERB speed)","p":[],"e":"He/She is eating a/the banana quickly."},{"k":"p","h":"In the above examples, we have the adverb <i>sasa tu</i> . The copula <i>sasa</i> goes before the contents of the adverb and connects to the object or verb. In SVO, the adverb goes after the object. In OSV, the adverb goes after the verb. In other words, the adverb is always last in a sentence."},{"k":"e","n":"Example 3.26","sub":[],"s":["sarTo ut as as road ul as hoaN uj  ."],"r":"[ju-nau] (sa lu dauwr sasa tu otras)","g":"[banana] (LINK eat ADVERB speed many-LINK)","p":[],"e":"I am eating a banana very quickly."},{"k":"p","h":"In example 3.26, a clause is used after the copula <i>sasa</i> . Clauses can go inside the <i>sasa</i> phrase, however one can not use any verbs (transitive or intransitive) inside the <i>sasa</i> phrase, as this is ungrammatical."},{"k":"h","t":"Multiple Verbs in a Sentence"},{"k":"p","h":"Now here are a few examples using sentences with multiple verbs."},{"k":"e","n":"Example 3.27","sub":[],"s":["sauad ul ruo ul"],"r":"[lu] (ouwr lu dauwas)","g":"[1] (want 1 eat-LINK)","p":[],"e":"I want to eat."},{"k":"e","n":"Example 3.28","sub":[],"s":["os road ul ruo ul"],"r":"[lu] (ouwr lu dauwr so)","g":"[1] (want I eat 3)","p":[],"e":"I want to eat it."},{"k":"p","h":"In Example 3.27, there are two verbs in the sentence: <i>ouwr</i> and <i>dauwa</i> , and it maintains an SVO structure where <i>lu ouwr</i> (I want) is the subject-verb, and <i>lu dauwas</i> (me eating) is the object of <i>ouwr</i> . <i>Dauwas</i> is a nominalized intransitive verb, as it does not have an object of its own."},{"k":"p","h":"In Example 3.28, the subject is <i>lu</i> , the verb is <i>ouwr</i> , and the object is <i>lu</i> <i>dauwr so</i> . The object alone in this sentence is its own clause, with its own subject, verb, and object. Using SVO word order is useful along with <i>Puwauwei-deg</i> ."},{"k":"p","h":"This is different from how English deals with multiple verbs in a sentence. This is because unlike in English, you cannot place a verb after a verb. in Arusian; only nouns and noun phrases can go after verbs. By forming a noun phrase such as <i>lu dauwas</i> (me eating) <i>,</i> after the verb in <i>Lu ouwr lu</i> <i>dauwas</i> (I want to eat), it is like saying, “I want me eating” or “I want me to eat.”"},{"k":"e","n":"Example 3.29","sub":[],"s":["road ul ruo ul as TuN"],"r":"[nut] (sa lu ouwr lu dauwr)","g":"[food] (LINK 1 want 1 eat)","p":[],"e":"I want to eat food."},{"k":"p","h":"In Example 3.29, <i>nut</i> is the object and the topic of the sentence. In the comment, we have <i>lu ouwr lu dauwr</i> . <i>Ouwr</i> is a transitive verb, and its object is <i>lu dauwr</i> , which follows it directly. <i>Dauwr</i> is also a transitive verb, and its object is the topic, <i>nut</i> ."},{"k":"h","t":"Nominalised Verbs"},{"k":"p","h":"In nominalised verbs, are verbs that are turn into nouns. To turn a verb into a noun, you take the root, <i>ko</i> (actor) or <i>fau</i> (patient) and affix them to the base root. Here are a few examples below."},{"k":"e","n":"Example 3.30","sub":[],"s":["s,ab oad ok"],"r":"[ko-dau] (beis)","g":"[eating] (goodness-LINK)","p":[],"e":"Eating is good."},{"k":"e","n":"Example 3.31","sub":[],"s":["saN oad oaF"],"r":"[fau-dau] (nas)","g":"[being.eaten] (badness-LINK)","p":[],"e":"Being eaten is bad."},{"k":"p","h":"In examples 3.30 and 3.31, the root <i>dau</i> (mouth) is being prefixed by the roots <i>ko</i> (action) and <i>fau</i> (in the state of). The root <i>ko</i> makes the the nominalized verb active, and the <i>fau</i> makes the nominalized verb passive. Any time a verb is being used like a noun, use the forms, <i>ko-ROOT</i> for actor nominalised verbs, and <i>fau-ROOT</i> for patient nominalised verbs."},{"k":"p","h":"Here are a few more examples to get the point across."},{"k":"e","n":"Example 3.32","sub":[],"s":["ruo ul as Gej ok"],"r":"[ko-keg] (sa lu ouwr)","g":"[celebrating] (LINK 1 like)","p":[],"e":"I like celebrating."},{"k":"e","n":"Example 3.33","sub":[],"s":["cev ok roev us"],"r":"[su] (veyor ko-vek)","g":"[3] (despises driving)","p":[],"e":"He doesn’t like driving."},{"k":"h","t":"Conjunctions"},{"k":"p","h":"There are far fewer conjunctions in Arusian than in English as there are only two conjunctions in the language. They are <i>osa</i> (a conjunction meaning “and,” “but,” or “also”), and <i>usu</i> (a conjunction meaning “or”). These linkers function syntactically the same. Here are a few examples."},{"k":"e","n":"Example 3.34","sub":[],"s":["ruo ul as u urv aulk aso led aulk"],"r":"Kluwa-del osa kluwa-vru u sa lu ouwr","g":"color-blue and color-violet RES.TOPIC LINK 1 like","p":[],"e":"I like blue and violet."},{"k":"p","h":"In Example 3.34, linker <i>osa</i> (and/but) is a conjunction. The resumptive pronoun <i>u</i> is needed here since, <i>“kluwa-del osa kluwa-vru”</i> is a clause and thus can be a sentence on its own. This is the same syntactic structure used for the copula <i>sa</i> ."},{"k":"e","n":"Example 3.35","sub":[],"s":["ruo ul as u ,aaJ usu aul"],"r":"Luwa usu cai u sa lu ouwr","g":"water or tea RES.TOPIC LINK 1 want","p":[],"e":"I want water or tea."},{"k":"p","h":"In Example 3.35, linker <i>usu</i> (or) is a conjunction. The resumptive pronoun <i>u</i> is needed here since, <i>“luwa usu cai”</i> is a clause and thus can be a sentence on its own. This is the same syntactic structure used for the copula <i>sa</i> ."},{"k":"p","h":"The conjunctions <i>osa</i> (and/but) and <i>usu</i> (or) can also be nouns, translating to something like also-ness and or-ness. These nouns can be used to build adverbs. Here are a few examples."},{"k":"e","n":"Example 3.36","sub":[],"s":["aso as as sauad ,aP ul"],"r":"Lu-pei dauwas sasa osa","g":"1P.EXCL eat-LINK ADV also","p":[],"e":"We eat also."},{"k":"p","h":"In Example 3.36, <i>osa</i> is an adverb as it begins with the adverb marker <i>sasa</i> ."},{"k":"e","n":"Example 3.37","sub":[],"s":["aso as u sauad ,aP ul"],"r":"Lu-pei dauwas u sa osa","g":"1P.EXCL eat-LINK RES.TOPIC LINK also","p":[],"e":"We eat also."},{"k":"p","h":"In Example 3.37, <i>osa</i> is a noun and is in a <i>sa</i> phrase. Notice that <i>-s</i> is not suffixed to <i>osa</i> . This is because even though <i>osa</i> and <i>usu</i> end in vowels, <i>sa</i> is not suffixed to these roots."},{"k":"h","t":"Intransitive Compound Verbs"},{"k":"p","h":"For intransitive compound verbs, verbs go inside the comment and are connected with the conjunction <i>osa</i> ."},{"k":"e","n":"Example 3.38","sub":[],"s":["auauM aso auaeav as ,aP us"],"r":"Su-pei sa vayauwa osa muwauwa","g":"3P LINK see-INTRANS and hear-INTRANS","p":[],"e":"They see and hear."},{"k":"e","n":"Example 3.39","sub":[],"s":["arled aso ,auut aso ,auumu as cev"],"r":"Vek sa umuuwei osa tuuwei osa delra","g":"car LINK big-INTRANS and fast-INTRANS and powerful-INTRANS","p":[],"e":"The car is big, fast and powerful."},{"k":"p","h":"For Examples 3.38 and 3.39, all intransitive verbs are inside the comment. Intransitive verbs are linked together using <i>osa</i> . Any number of verbs can go inside the comment."},{"k":"h","t":"Transitive Compound Verbs"},{"k":"p","h":"For transitive compound verbs, the situation is different from intransitive verbs, as they behave differently. Transitive verbal clauses are connected with the resumptive pronouns, <i>u</i> and <i>wei</i> ."},{"k":"e","n":"Example 3.40","sub":[],"s":["lev roaP u rGeM ,aas aM"],"r":"Ma-sai megr u pauwr vel","g":"Aunt scars-TRANS RES.TOPIC hit-TRANS female","p":[],"e":"The aunt scars and hits the woman."},{"k":"p","h":"In Example 3.40, the clause, m <i>a-sai megr</i> (the aunt scars), is refered to by the resumptive pronoun <i>u</i> . <i>U</i> then is the subject of pauwr (to hit). it is assumed that both <i>megr</i> and <i>pauwr</i> share the same object, <i>vel</i> (woman)."},{"k":"e","n":"Example 3.41","sub":[],"s":["roaP ,au rGeM ,aas aM as lev"],"r":"Vel sa ma-sai megr wei pauwr","g":"woman LINK aunt scars-TRANS RES.COM hit-TRANS","p":[],"e":"The aunt scars and hits the woman."},{"k":"p","h":"In Example 3.41, Vel (woman) is the topic of the sentence. The resumptive pronoun wei is used here as <i>pauwr</i> (hit) is connecting tothe clause, <i>mai-sai</i> <i>megr</i> (the aunt scars) which is inside the comment. <i>Vel</i> (woman) is assumed to be the object of both verbs <i>megr</i> and <i>pauwr</i> ."}]},
            {"n":4,"t":"Possession","r":"Ouwek","s":"ceuo","b":[{"k":"p","h":"Possession in Arusian isn’t as precise as it is in English. Possession can refer to a relationship with the item in question and does not necessarily imply ownership or belonging to an object. Here are a few examples in action. To indicate possession, one can attach a comment relating to the person doing the possessing."},{"k":"e","n":"Example 4.1","sub":[],"s":[". sul seM ."],"r":"Mes lus.","g":"home 1-LINK","p":[],"e":"The house is mine."},{"k":"e","n":"Example 4.2","sub":[],"s":[". s,at auj ."],"r":"Juwa teis.","g":"book 2-LINK","p":[],"e":"The book is yours."},{"k":"p","h":"In Example 4.1, we have the clause <i>mes lus</i> . The pronoun <i>lu</i> is commented onto the root <i>mes</i> (home/house). This literally translates to &#x27;home of me&#x27; and is a complete sentence. The pronoun <i>lu</i> is interpreted as &#x27;my&#x27; and is the comment of <i>mes</i> ."},{"k":"p","h":"In Example 4.2, the pronoun <i>tei</i> is commented onto the root <i>juwa</i> . This literally translates to &#x27;book of you.&#x27; The pronoun <i>tei</i> is interpreted as &#x27;your&#x27; and is the comment of <i>juwa</i> ."},{"k":"e","n":"Example 4.3","sub":[],"s":[". sos mer aeat ."],"r":"taya-rem sos.","g":"pencil his/her-LINK","p":[],"e":"The pencil is his/hers."},{"k":"p","h":"In Example 4.3, the pronoun <i>so</i> is commented onto the root <i>taya-rem</i> . This literally translates to &#x27;pencil of him/her/it&#x27; and is interpreted as &#x27;his/her pencil.&#x27; More will be discussed on how to use <i>su</i> and <i>so</i> in Lesson 5."},{"k":"e","n":"Example 4.4","sub":[],"s":[". ul ,at as TuN ."],"r":"Nut sa tei-lu.","g":"Food of we.INCLUSIVE-LINK","p":[],"e":"The food is ours."},{"k":"e","n":"Example 4.5","sub":[],"s":[". ,aP ul as url ."],"r":"Lru sa lu-pei.","g":"Dog of 1P.EXCL","p":[],"e":"Our dog."},{"k":"p","h":"In Example 4.4, the compound pronoun <i>tei-lu</i> is commented onto the root <i>nut</i> . This literally translates to &#x27;food of us&#x27; and is interpreted as &#x27;our food.&#x27;"},{"k":"p","h":"In Example 4.5, the compound pronoun <i>lu-pei</i> is commented onto the root <i>lru</i> . This literally translates to &#x27;dog of us,&#x27; where it is interpreted as &#x27;our dog.&#x27;"},{"k":"e","n":"Example 4.5","sub":[],"s":[". cul as ,aj ."],"r":"Jei sa luk.","g":"game LINK child","p":[],"e":"The child’s game."},{"k":"p","h":"In Example 4.5, the noun <i>luk</i> is commented onto the root <i>jei</i> . This literally translates to &#x27;game of child,&#x27; or &#x27;child’s game.&#x27;"},{"k":"p","h":"To display ownership, one can reduplicate the pronoun after the item that is being owned."},{"k":"e","n":"Example 4.6","sub":[],"s":[". sul ul as ,aak ."],"r":"Kai sa lu lus.","g":"art LINK 1 1-LINK","p":[],"e":"My art."},{"k":"e","n":"Example 4.7","sub":[],"s":[". ,ad auaP as ,ad auaP as cev ."],"r":"Vek sa Pauwa-dei sa Pauwa-dei.","g":"car LINK Pauwa-N LINK Pauwa-N","p":[],"e":"Pauwa’s car."},{"k":"p","h":"In Examples 4.6 and 4.7, ownership is shown by the reduplication of the pronoun <i>lu</i> and the name <i>Pauwa</i> in the comment. One can use reduplication to indicate belonging."},{"k":"e","n":"Example 4.8","sub":[],"s":[". rceuo ul as u suP ,aak ."],"r":"Kai pus u sa lu ouwekr.","g":"art here-LINK RES.TOPIC LINK 1 own","p":[],"e":"I own this art."},{"k":"p","h":"In Example 4.8, ownership is expressed using the verb <i>ouwekr</i> , meaning &#x27;to own.&#x27; This is an alternative way to express ownership without reduplication."}]},
            {"n":5,"t":"Topic and Non-topic Pronouns","r":"Su osa So","s":"os aso us","b":[{"k":"p","h":"The Arusian language has third-person pronouns, <i>su</i> , and <i>so</i> . The pronoun <i>su</i> , refers to the topic of the sentence, while the pronoun <i>so,</i> refers to a non-topic. When a third-person pronoun begins a sentence (AKA it’s the topic), it must always have the form, <i>su</i> . Below are examples of how these pronouns are used."},{"k":"e","n":"Example 5.1","sub":[],"s":[". s,,aeaua us ."],"r":"su auwayeis. 3 being.beautiful-LINK","g":"","p":[],"e":"It/He/She is beautiful."},{"k":"p","h":"In Example 5.1, we can see that <i>su</i> is the topic of the sentence. Since the pronoun is in the topic of the sentence, we must use <i>su</i> . However, if we reverse the words, making <i>auwayei</i> the topic instead, the pronoun will now be in the comment. Because the pronoun is not referring to the topic, we use the form, <i>so</i> (see Example 2)."},{"k":"e","n":"Example 5.2","sub":[],"s":[". sos ,aeaua ."],"r":"auwayei sos.","g":"being.beautiful 3-LINK","p":[],"e":"It/He/She is beautiful."},{"k":"p","h":"In Example 5.2, the pronoun is in the non topic form since it is not referring to the topic, <i>auwayei</i> ."},{"k":"p","h":"Note: You can never start a sentence with the pronoun <i>so</i> ."},{"k":"e","n":"Example 5.3","sub":[],"s":[". sus TuN rmak ,ad aeuj ."],"r":"Juweya-dei kamr nut sus.","g":"Juweya-NAME have food he-LINK","p":[],"e":"Juweya has his own food."},{"k":"p","h":"In Example 5.3, we can see that the pronoun <i>su</i> is present and it is referring to Juweya being the person having his own food, as Juweya is the topic of the sentence."},{"k":"e","n":"Example 5.4","sub":[],"s":[". sos TuN rmak ,ad aeuj ."],"r":"Juweya-dei kamr nut sos","g":"Juweya-NAME have food 3-LINK","p":[],"e":"Juweya has his/her food."},{"k":"p","h":"In Example 5.4, we can see that the pronoun <i>so</i> is present instead of <i>su</i> , as in Example 5.3. <i>So</i> is not referring to Juweya, but to another person that’s not the topic or mentioned in the sentence for that matter. In this case, Juweya has someone else’s food."}]},
            {"n":6,"t":"Inclusive and Exclusive We","r":"Tei-lu osa Lu-pei","s":", aP ul aso ul ,at","b":[{"k":"p","h":"There are two types of the pronoun &#x27;we&#x27; in Arusian: <i>lu-pei</i> , which is the exclusive &#x27;we&#x27; meaning it does not include the listener, and <i>tei-lu</i> , the inclusive &#x27;we,&#x27; which includes the listener. Here are a few examples of these pronouns being used below."},{"k":"e","n":"Example 6.1","sub":["Using exclusive we:"],"s":[". ,aP ul rmu ,aP ul ."],"r":"Lu-pei umr lu-pei","g":"1P.EXCL cherish 1P.EXCL","p":[],"e":"We cherish each other."},{"k":"p","h":"In Example 6.1, the pronoun <i>lu-pei</i> is used. <i>Lu-pei</i> translates to &#x27;we,&#x27; excluding the listener."},{"k":"e","n":"Example 6.2","sub":["Using exclusive we:"],"s":[". rt ul ,at as cub ."],"r":"Buk sa tei-lu tr.","g":"Store LINK 1P.INCL go","p":[],"e":"We go to the store."},{"k":"p","h":"In Example 6.2, The pronoun <i>tei-lu</i> is used. <i>Tei-lu</i> translates to &#x27;we,&#x27; including the listener."}]},
            {"n":7,"t":"Word Order","r":"Luwed sa Tep","s":"Bet as deul","b":[{"k":"p","h":"There are two main word orders one can use, depending on what is made the topic of the sentence. When the object (the patient of the verb) is the topic of the sentence, the word order is Object-Subject-Verb (OSV). This can be seen in Lesson 3."},{"k":"p","h":"One can use either word order in active or passive voice. The examples below all have the same meaning and use the same words. Each example depicts how to arrange the words depending on the word order. Here are the possible ways to form a sentence in the examples below."},{"k":"e","n":"Example 7.1","sub":["Active Voice in SVO:"],"s":[". ,auad os ruo ul ."],"r":"Lu ouwr so-dauwei.","g":"1 want food.OBV","p":[],"e":"I want food."},{"k":"e","n":"","sub":["Active Voice in OSV:"],"s":[". ruo ul as ,auad us ."],"r":"Su-dauwei sa lu ouwr.","g":"food LINK 1 want","p":[],"e":"I want food."},{"k":"e","n":"","sub":["Passive Voice in SVO:"],"s":[". ul ,r suo ,auad us ."],"r":"Su-dauwei ouse lu.","g":"food wanted.by","p":[],"e":"Food wanted by me."},{"k":"e","n":"","sub":["Passive Voice in OSV:"],"s":[". ,r suo ,auad os as ul ."],"r":"Lu sa so-dauwei ouse.","g":"LINK food-OBV wanted.by","p":[],"e":"Food wanted by me."},{"k":"p","h":"As shown in Example 7.1, there are four possible ways to arrange words in a sentence using the methods we have learned in previous chapters. Changing the topic of the sentence often requires changing the word order."},{"k":"e","n":"Example 7.2","sub":["Active Voice in VOS:"],"s":[". sul ,auad us auo ,r ."],"r":"Erouwa-su-dauwei lus.","g":"wanting food 1-LINK","p":[],"e":"I want food."},{"k":"e","n":"","sub":["Passive Voice in VOS:"],"s":[". ,auad os as ul ,auo ,r ."],"r":"Er-ouwei lu sa so-dauwei.","g":"1 LINK food.OBV wanted.by","p":[],"e":"Food wanted by me."},{"k":"p","h":"In Example 7.2, we see that VOS is another possible word order one could use. This word order makes the verb and object the topic of the sentence. VOS order will be explained further in Lesson 8."}]},
            {"n":8,"t":"Topical Verbs","r":"Ko-tep sa Ag","s":"Ga as Bet ok","b":[{"k":"p","h":"It is possible to make the verb the topic of a sentence, along with its object. To create topical verbs, the prefix E/Er is placed in front of a root, and to make the verb active or passive, the nominalized active and passive endings are added to the root (the exact form of the root will change depending on the root). These topical verbs are nominalized and are attached to their object as one word, with the subject placed in the comment. Below, in Example 8.1, is a common irregular topical verb."},{"k":"h","t":"Topical Irregular Verb"},{"k":"e","n":"Example 8.1","sub":[],"s":[". os rok ul as ,at a,r ."],"r":"Era-tei sa lu kor so.","g":"for-you LINK 1 do 3","p":[],"e":"I do it for/to you."},{"k":"p","h":"In Example 8.1, the topical verb, <i>era,</i> translates to &quot;for/to&quot; or &quot;to help,&quot; and it is attached to <i>tei.</i> This verb is active and irregular, and it comes from the root <i>ed,</i> meaning &quot;help.&quot; The combination <i>era-tei</i> translates to &quot;for you&quot; or &quot;help you&quot; and acts as the dative in the sentence. This verb has no patient form as a topical verb because it is irregular."},{"k":"h","t":"Topical Verbs Neither Passive nor Active"},{"k":"e","n":"Example 8.2","sub":[],"s":[". al ok oJ road ul as ,at arm,r ."],"r":"Emra-tei sa lu dauwr co-ko-la.","g":"With-2 LINK 1 eat chocolate","p":[],"e":"I eat chocolate with you."},{"k":"p","h":"In Example 8.2, the topical verb <i>emra</i> is used, derived from the root <i>rmr,</i> meaning &#x27;with.&#x27; This verb is irregular and is always an active verb."},{"k":"e","n":"Example 8.3","sub":[],"s":[". sauad ul as TuN ,aaP aeaP ,r ."],"r":"Erpaya-pai-nut sa lu dauwas.","g":"at-restaurant LINK 1 eating","p":[],"e":"I eat at the restaurant."},{"k":"p","h":"In Example 8.3, the topical verb <i>erpaya</i> translates to &#x27;where&#x27; or &#x27;at,&#x27; and it is attached to <i>pai-nut</i> (restaurant). The verb is derived from the root <i>pai,</i> meaning &#x27;place&#x27;. The combination <i>erpaya-pai-nut</i> (at-restaurant) serves as the locative of the sentence."},{"k":"e","n":"Example 8.4","sub":[],"s":[". sarcet ul as Ged al art Ges ,r ."],"r":"Erseg-tra-la-deg sa lu tekras.","g":"on-monday LINK study","p":[],"e":"I study on Monday."},{"k":"p","h":"In Example 8.4, the topical verb <i>ersegra</i> translates to &#x27;when&#x27; or &#x27;on,&#x27; and it is attached to <i>tra-la-deg</i> (Monday). The topical verb is neither active nor passive and is made from the root <i>seg</i> , meaning &#x27;distant time.&#x27; The combination <i>erseg-</i> <i>tra-la-deg</i> (when-Monday) is the temporal element of the sentence."},{"k":"e","n":"Example 8.5","sub":[],"s":[". sarcet ul as u suP leu leu ,r ."],"r":"Erwel-wel pus u sa lu tekras.","g":"duing-hour here-LINK RES.TOPIC LINK 1 study","p":[],"e":"I study now. / I study this hour."},{"k":"p","h":"In Example 8.5, the topical verb <i>erwel</i> translates to &#x27;when&#x27; or &#x27;on&#x27; for time within the same day, and it is attached to <i>wel</i> (hour). The topical verb is in neither active nor passive voice and is formed using the root <i>wel</i> . The combination <i>erwel-wel</i> serves as the temporal element of the sentence, and <i>erwel-wel pus u</i> means something like &#x27;during now&#x27; or &#x27;during this hour.&#x27;"},{"k":"e","n":"Example 8.6","sub":[],"s":[". rde,at aM as urb as cuP aeud ,r ."],"r":"Erduweya-puk sa bru sa ma teyedr.","g":"against-baby LINK cookie LINK mother takes","p":[],"e":"The mother takes away the cookie from the baby."},{"k":"p","h":"In Example 8.6, the topical verb <i>erduweya</i> translates to &#x27;against,&#x27; and it is attached to <i>puk</i> (baby). The combination <i>erduweya-puk</i> (against-baby) serves as the ablative element of the sentence."},{"k":"h","t":"Topical Verbs with Active and Passive Voice"},{"k":"e","n":"Example 8.7","sub":[],"s":[". s,armuN ul ruo ul as ok ,ac,r ."],"r":"Erkei-ko sa lu ouwr lu numreis.","g":"because-work LINK 1 want 1 being.alseep","p":[],"e":"I want to sleep because of work."},{"k":"p","h":"In Example 8.7, the topical verb <i>erkei</i> translates to &#x27;because&#x27; or &#x27;cause of,&#x27; and it is attached to <i>ko</i> (work). The combination <i>erkei-ko</i> (because-work) indicates the reason or cause of the sentence. This verb is neither active nor passive, meaning it can be interpreted as &#x27;because&#x27; or &#x27;cause of.&#x27;"},{"k":"e","n":"Example 8.8","sub":[],"s":[". s,armuN ul ruo ul as ok ,aec,r ."],"r":"Erkeyei-ko sa lu ouwr lu numreis.","g":"because-action LINK 1 want 1 being.alseep","p":[],"e":"I want to sleep because of work."},{"k":"p","h":"In Example 8.8, the topical verb <i>erkeyei</i> is a passive verb translating to &#x27;because&#x27; or &#x27;caused by.&#x27; The entire topic translates to something like &#x27;because-work&#x27; and acts as one word."},{"k":"e","n":"Example 8.9","sub":[],"s":[". sok u s,armuN ul ruo ul aec,r ."],"r":"Erkeya-lu ouwr lu numreis u kos.","g":"resulting want being.alseep RES.TOPIC action-LINK","p":[],"e":"I want to sleep because of work."},{"k":"p","h":"In Example 8.9, the topical verb <i>erkeya</i> is an active verb translating to &#x27;cause of.&#x27; The entire topic translates to something like &#x27;cause of my wanting to sleep&#x27; and acts as one word."},{"k":"e","n":"Example 8.10","sub":[],"s":[". oarl rj,ek ul as oaP armer ,r ."],"r":"Eremra-pau sa lu kijr lrau.","g":"using-hammer LINK 1 break glass.","p":[],"e":"I break glass using a hammer."},{"k":"p","h":"In Example 8.10, the topical verb <i>er-remra</i> translates to &#x27;using&#x27; and is attached to <i>pau</i> (hammer). The verb is in active voice and is formed from the root <i>remra</i> . The combination <i>er-remra-pau</i> (using-hammer) serves as the instrumental in the sentence."},{"k":"e","n":"Example 8.11","sub":[],"s":[". surb u sul cuP ,auad ,r ."],"r":"Erdauwei-puk lus u brus.","g":"eaten.by baby 1-LINK RES.TOPIC cookie-LINK","p":[],"e":"The cookie was eaten by my baby."},{"k":"p","h":"In Example 8.11, the topical verb <i>erdauwei</i> translates to &#x27;eaten by,&#x27; and it is attached to the noun phrase <i>luk lus,</i> meaning &#x27;my child.&#x27; The combination <i>erdauwei puk lus</i> translates to &#x27;eaten by my child.&#x27; The topical verb here is a patient verb."},{"k":"e","n":"Example 8.12","sub":[],"s":[". sul cul as urb auad ,r ."],"r":"Erdauwa-bru sa luk lus.","g":"eat-cookie LINK child 1-LINK.","p":[],"e":"The child eats the cookie."},{"k":"p","h":"In Example 8.12, the topical verb <i>erdauwa</i> translates to &#x27;eat,&#x27; and it is attached to the noun <i>bru,</i> meaning &#x27;cookie.&#x27; The combination <i>erdauwa bru</i> translates to &#x27;eat cookie.&#x27; The topical verb here is an active verb."},{"k":"p","h":"Below is a table of some topical verbs and their forms. These verbs are used when the verb is the most important thing that needs to be expressed."},{"k":"t","cap":[["t","Examples of Topical Verb Forms"]],"rows":[[{"c":1,"th":true,"l":[["t","Root"]]},{"c":1,"th":true,"l":[["t","Neutre"]]},{"c":1,"th":true,"l":[["t","Agent"]]},{"c":1,"th":true,"l":[["t","Patient"]]}],[{"c":1,"th":false,"l":[["s","oad"],["r","dau"],["n","mouth"]]},{"c":1,"th":false,"l":[["s","oad ,r"],["r","erdau"],["n","eating/eaten by"]]},{"c":1,"th":false,"l":[["s","auad ,r"],["r","erdauwa"],["n","eating"]]},{"c":1,"th":false,"l":[["s",",auad ,r"],["r","erdauwei"],["n","eaten by"]]}],[{"c":1,"th":false,"l":[["s",",ak"],["r","kei"],["n","reason"]]},{"c":1,"th":false,"l":[["s",",ac,r"],["r","erkei"],["n","caused by/causing"]]},{"c":1,"th":false,"l":[["s","aec,r"],["r","erkeya"],["n","causing"]]},{"c":1,"th":false,"l":[["s",",aec,r"],["r","erkeyei"],["n","caused by"]]}],[{"c":1,"th":false,"l":[["s",",aaP"],["r","pai"],["n","place"]]},{"c":1,"th":false,"l":[["s",",aaP ,r"],["r","erpai"],["n","located at"]]},{"c":1,"th":false,"l":[["s","aeaP ,r"],["r","erpaya"],["n","located at"]]},{"c":1,"th":false,"l":[["s",",aeaP ,r"],["r","erpayei"],["n","located at"]]}],[{"c":1,"th":false,"l":[["s","de"],["r","ed"],["n","help"]]},{"c":1,"th":true,"l":[["t","N/A"]]},{"c":1,"th":false,"l":[["s","a,r"],["r","era"],["n","helping/for"]]},{"c":1,"th":true,"l":[["t","N/A"]]}],[{"c":1,"th":false,"l":[["s","rmr"],["r","rmr"],["n","with"]]},{"c":1,"th":true,"l":[["t","N/A"]]},{"c":1,"th":false,"l":[["s","arm,r"],["r","ermra"],["n","be with"]]},{"c":1,"th":true,"l":[["t","N/A"]]}]]}]},
            {"n":9,"t":"Linking Words","r":"Lekrei-tep","s":"Bet ,arcel","b":[{"k":"p","h":"Linking is done by putting two roots together to create a new word or concept. Linking words can also be turned into verbs, as will be shown below. Here is a table of two common linking words and their appropriate verb forms."},{"k":"t","cap":[["t","Linking Words"]],"rows":[[{"c":1,"th":false,"l":[["t","Root"]]},{"c":1,"th":false,"l":[["s","Germr med"],["r","dem-rmreg"],["n","conversation"]]},{"c":1,"th":false,"l":[["s","lek ,aaP"],["r","pai-kel"],["n","inbetween-ness"]]},{"c":1,"th":false,"l":[["s",",aak ,aat"],["r","tai-kai"],["n","drawing"]]}],[{"c":1,"th":false,"l":[["t","Transitive"],["t","Agent Verb"]]},{"c":1,"th":false,"l":[["s","rmr rmed"],["r","dem-rmr"],["n","to talk with"]]},{"c":1,"th":false,"l":[["s","r,aaP rlek"],["r","kelr-payr"],["n","in between"]]},{"c":1,"th":false,"l":[["s","r,aak r,aat"],["r","tayr-kayr"],["n","to draw"]]}],[{"c":1,"th":false,"l":[["t","Transitive"],["t","Patient Verb"]]},{"c":1,"th":false,"l":[["s",",r srmr ,r smed"],["r","demse-rmrse"],["n","talked with by"]]},{"c":1,"th":false,"l":[["s",",r s,aaP ,r Slek"],["r","kelse-paise"],["n","seperated by"]]},{"c":1,"th":false,"l":[["s",",r s,aak ,r s,aat"],["r","taise-kaise"],["n","to draw"]]}],[{"c":1,"th":false,"l":[["t","Intransitive"],["t","Agent Verb"]]},{"c":1,"th":false,"l":[["s","armr armed"],["r","demra-rmra"],["n","conversating"]]},{"c":1,"th":false,"l":[["s","aeaP arlek"],["r","kelra-paya"],["n","in between"]]},{"c":1,"th":false,"l":[["s","aeak aeat"],["r","taya-kaya"],["n","drawing"]]}],[{"c":1,"th":false,"l":[["t","Intransitive"],["t","Patient Verb"]]},{"c":1,"th":false,"l":[["s",",armr ,armed"],["r","demrei-rmrei"],["n","being conversated"]]},{"c":1,"th":false,"l":[["s",",aeaP ,arlek"],["r","kelrei-payei"],["n","being separated"]]},{"c":1,"th":false,"l":[["s",",aeak ,aeat"],["r","tayei-kayei"],["n","being drawn"]]}]]},{"k":"p","h":"As we can see in the table above, the verbalizers of their composed roots match, as all linking words are structured similarly. If the linking verb is a state, there exist no intransitive form and uses a the transitive verb and pronoun instead. This can be seen in the table above for the example, <i>pai-kel</i> Here are a few example sentences using these linking words."},{"k":"e","n":"Example 9.1","sub":[],"s":[". rmr rmed os as aM ."],"r":"Ma sa so demr-rmr.","g":"mother LINK 3.OBV talking-with","p":[],"e":"He/She talks with the mother."},{"k":"e","n":"Example 9.2","sub":[],"s":[". at ,aP as ark r,aaP rlek ,at ."],"r":"Tei kelr-payr kra sa pei-ta.","g":"2 between building LINK NUM-two","p":[],"e":"You are between two buildings."},{"k":"p","h":"As we can see in examples 9.1 and 9.2, linking verbs in the active voice are being used. These verbs act just like the non-linking verbs from previous chapters."},{"k":"e","n":"Example 9.3","sub":[],"s":[". os r,aaP rlek ,at ."],"r":"Tei kelr-payr so.","g":"inbetween 3.OBV","p":[],"e":"You are inbetween."},{"k":"p","h":"As we can see in examples 9.3, <i>kelr-payr</i> meaning “inbetween” is a state verb, meaning there is not intransitive verb. A pronoun is used here."}]},
            {"n":10,"t":"Questions","r":"Su-Adrei","s":"arda us","b":[{"k":"p","h":"There are three types of questions in Arusian. To indicate a polar question (a yes/no question), you use the question marker <i>nepa</i> . To indicate an open- ended question (a question where a long answer is expected), you use the question marker <i>puwei</i> . And to indicate a request, you use the question marker <i>plei</i> ."},{"k":"p","h":"The markers, <i>nepa</i> , <i>puwei</i> and <i>plei</i> are suffixed to the item that is being asked about in a sentence. The item being asked about is also always the topic of the sentence. Here are a few examples of questions using the different markers below."},{"k":"h","t":"Using The Polar Question Marker"},{"k":"e","n":"Example 10.1","sub":[],"s":[". sauok ,at apeN ."],"r":"Nepa-tei kouwas?","g":"Q.POLAR-2 do-LINK","p":[],"e":"Do you do it?"},{"k":"e","n":"Example 10.2","sub":[],"s":[". ,r suF ,at as TuN ,aaP apeN ."],"r":"Nepa-nut sa tei fuse?","g":"Q.POLAR-restaurant of you there","p":[],"e":"Are you at the restaurant?"},{"k":"p","h":"In both examples above, we see that the polar question marker <i>nepa</i> is being used. <i>Nepа</i> originates from the French phrase <i>n’est-ce pas</i> and is used for yes/no questions, otherwise known as polar questions. You use <i>nepa</i> when you are expecting a yes/no answer from the listener. In Example 1, we see that <i>nepa</i> is attached to <i>tei</i> . This indicates that <i>tei</i> is the thing being asked about. Similarly, in example 10.2, <i>pai-nut</i> is the thing being asked about."},{"k":"e","n":"Example 10.3","sub":[],"s":[". ,arak ,aaJ usu ,aaJ ruo ,at apeN ."],"r":"Nepa-tei ouwr cai usu cai-karei ?","g":"Q.POLAR-2 want tea or coffee","p":[],"e":"Do do want tea or coffee?"},{"k":"p","h":"As shown in example 10.3, ‘Or’ questions also use the question mark <i>Nepa</i> , along with polar questions."},{"k":"h","t":"Using The Open-Ended Question Marker"},{"k":"p","h":"There are no single words for question words like &#x27;what,&#x27; &#x27;why,&#x27; &#x27;when,&#x27; &#x27;how,&#x27; etc. Instead, the open-ended question marker <i>puwei</i> is attached to the thing being asked about. This combination of <i>puwei</i> and a root creates words that can translate to words like &#x27;what,&#x27; &#x27;why,&#x27; &#x27;when,&#x27; &#x27;how,&#x27; etc. Here are the examples below."},{"k":"e","n":"Example 10.4","sub":[],"s":[". os rok ,at ,auP ."],"r":"Puwei-tei kor so?","g":"Q-2 do 3","p":[],"e":"What do you do?"},{"k":"p","h":"In Example 10.4, the question begins with the open-ended question marker <i>puwei</i> . This marker is used when the speaker is asking for a non-polar question from the listener. The question marker <i>puwei</i> is attached to <i>tei</i> , as <i>tei</i> is the thing being asked about. As we can see, the contents of example 10.3 are the same as in example 10.1, except the question marker <i>puwei</i> is being used instead of <i>nepa</i> . The question marker solely changes the type of question, and there is no need to change the structure of the sentence or the word order."},{"k":"e","n":"Example 10.5","sub":[],"s":[". rt ,at as ,aaP ,auP ."],"r":"Puwei-pai sa tei tr?","g":"Q-place LINK 2 go","p":[],"e":"Where are you going?"},{"k":"p","h":"In Example 10.5, the topic is composed of the question marker <i>puwei</i> and <i>pai</i> , which can be translated as &#x27;where&#x27; in English. <i>Pai</i> (location) is the thing being asked about."},{"k":"e","n":"Example 10.6","sub":[],"s":[". sauok ,aP m.ov as ,al ,auP ."],"r":"Puwei-lei sa vom kouwas?","g":"Q-way LINK person-PLURAL do","p":[],"e":"How do people do it?"},{"k":"p","h":"In example 10.6, the topic <i>puwei-lei</i> can be translated as &#x27;how.&#x27; <i>Puwei</i> is attached to <i>lei</i> (way) as <i>lei</i> is what is being asked about."},{"k":"e","n":"Example 10.7","sub":[],"s":[". sarGerM ,at as leu ,auP ."],"r":"Puwei-wel sa tei mregras?","g":"Q-hour of you leave","p":[],"e":"When do you leave?"},{"k":"p","h":"In Example 10.7, the topic is <i>puwei-wel</i> , and can be translated as &#x27;when.&#x27; <i>Wel</i> is what is being asked ."},{"k":"e","n":"Example 10.8","sub":[],"s":[". sauok ,at as ,ak ,auP ."],"r":"Puwei-kei sa tei kouwas?","g":"Q-reason LINK 2 do-LINK","p":[],"e":"Why do you work?"},{"k":"p","h":"In Example 10.8, the topic is <i>puwei-kei</i> , and can be translated as &#x27;why.&#x27; <i>Kei</i> is what is being asked as <i>puwei</i> is attached to it."},{"k":"e","n":"Example 10.9","sub":[],"s":[". suP cerv ,auP ."],"r":"Puwei-vrek pus?","g":"Q-thing here-of","p":[],"e":"What is here? / What is this?"},{"k":"p","h":"In Example 10.9, the topic is <i>puwei-vrek</i> , and can be translated as &#x27;what.&#x27; <i>Vrek</i> is what is being asked as <i>puwei</i> is attached to it."},{"k":"e","n":"Example 10.10","sub":[],"s":[". s,at armed ,auP ."],"r":"Puwei-demra teis?","g":"Q-talking 2-LINK","p":[],"e":"What are you talking about?"},{"k":"p","h":"In Example 10.10, the topic <i>puwei-demra</i> doesn’t have an exact translation into English but means something like &#x27;what is talked about.&#x27; <i>Demra</i> is what is being asked about, and <i>puwei</i> is attached to it."},{"k":"e","n":"Example 10.11","sub":[],"s":[". s,at lers ,auP ."],"r":"Puwei-srel teis?","g":"Q-identity 2-LINK","p":[],"e":"Who are you?"},{"k":"p","h":"In example 10.11, the topic is <i>puwei-srel</i> . <i>srel</i> translates to “identity” which is the thing being asked in this sentence."},{"k":"e","n":"Example 10.12","sub":[],"s":[". s,at armed ,auP ."],"r":"Puwei-demra teis?","g":"Q-talking 2-LINK","p":[],"e":"What are you talking about?"},{"k":"p","h":"In example 10.11, the topic is <i>puwei-demra</i> . <i>demra</i> translates to “talking” which is the thing being asked in this sentence."},{"k":"h","t":"Using The Request Question Marker"},{"k":"p","h":"This marker is used for when you want to request a favor from the listener. Here are a few examples below."},{"k":"e","n":"Example 10.13","sub":[],"s":[". os rok ,at ,alP ."],"r":"Plei-tei kor so?","g":"Q.REQ-2 do","p":[],"e":"May you do it?"},{"k":"p","h":"In Example 10.11, the request marker <i>plei</i> is attached to <i>tei</i> , as it is the person being asked to perform the request."},{"k":"e","n":"Example 10.14","sub":[],"s":[". rmak ul as aul ,alP ."],"r":"Plei-luwa sa lu kamr?","g":"Q.REQ-water of I have","p":[],"e":"May I have water?"},{"k":"p","h":"In Example 10.13, &#x27;Water&#x27; is the thing that is being requested, as it is attached to the question marker, <i>plei</i> ."},{"k":"p","h":"Despite their not being individual words for question words in English, here are a few useful phrases for asking questions."},{"k":"t","cap":[["t","Question Words"]],"rows":[[{"c":1,"th":false,"l":[["t","what / who"]]},{"c":1,"th":false,"l":[["s","us ,auP"],["r","puwei-su"]]},{"c":1,"th":false,"l":[["t","how many"]]},{"c":1,"th":false,"l":[["s","Tok ,auP"],["r","puwei-kot"]]}],[{"c":1,"th":false,"l":[["t","how"]]},{"c":1,"th":false,"l":[["s",",al ,auP"],["r","puwei-lei"]]},{"c":1,"th":false,"l":[["t","what"]]},{"c":1,"th":false,"l":[["s","Germrt ,auP"],["r","puwei-trmreg"]]}],[{"c":1,"th":false,"l":[["t","why"]]},{"c":1,"th":false,"l":[["s",",ak ,auP"],["r","puwei-kei"]]},{"c":1,"th":false,"l":[["t","who"]]},{"c":1,"th":false,"l":[["s","lers ,auP"],["r","puwei-srel"]]}],[{"c":1,"th":false,"l":[["t","when"]]},{"c":1,"th":false,"l":[["s","Ges ,auP"],["r","puwei-seg"]]},{"c":1,"th":false,"l":[["t","how much (price)"]]},{"c":1,"th":false,"l":[["s",",aad ,auP"],["r","puwei-dai"]]}],[{"c":1,"th":false,"l":[["t","when"]]},{"c":1,"th":false,"l":[["s","leu ,auP"],["r","puwei-wel"]]},{"c":1,"th":false,"l":[["t","what (are you /"],["t","are they) doing"]]},{"c":1,"th":false,"l":[["s","ok ,auP"],["r","puwei-ko"]]}],[{"c":1,"th":false,"l":[["t","where"]]},{"c":1,"th":false,"l":[["s",",aaP ,auP"],["r","puwei-pai"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]}],[{"c":1,"th":false,"l":[["t","which"]]},{"c":1,"th":false,"l":[["s","al ,auP"],["r","puwei-la"]]},{"c":1,"th":false,"l":[]},{"c":1,"th":false,"l":[]}]]}]},
            {"n":11,"t":"Comparison","r":"Tum","s":"mut","b":[{"k":"p","h":"The following examples below will display how comparisons are made in Arusian."},{"k":"h","t":"Sentences Using “More Than” and “Most”"},{"k":"e","n":"Example 11.1","sub":[],"s":[". os rmut u sad ,aeaua as lev ."],"r":"Vel sa auwayei das u tumr vel fos.","g":"female LINK being.beautiful more-LINK RES.TOPIC than 3.OBV","p":[],"e":"The woman is more beautiful than that woman."},{"k":"e","n":"Example 11.2","sub":[],"s":[". arlk rmut u ad as as cus ruo ul ."],"r":"Lu ouwr suk sasa da u tumr klra.","g":"1 want sugar ADV more RES.TOPIC than salt","p":[],"e":"I like/want sugar more than salt."},{"k":"e","n":"Example 11.3","sub":[],"s":[". rmak ul as u sarad ,auad us ."],"r":"Su-dauwei daras u sa so kamr.","g":"food most-LINK RES.TOPIC LINK have","p":[],"e":"I have the most food."},{"k":"h","t":"Sentences Using “Less Than” and “Least”"},{"k":"e","n":"Example 11.4","sub":[],"s":[". os rmut u Get as ,aeaua as lev ."],"r":"Vel sa auwayei sa teg u tumr so.","g":"female LINK being.beautiful of less RES.TOPIC than 3.OBV","p":[],"e":"The woman is less beautiful than it/her/him."},{"k":"e","n":"Example 11.5","sub":[],"s":[". arlk rmut u Get as as cus ruo ul ."],"r":"Lu ouwr suk sasa teg u tumr klra.","g":"1 want sugar ADV less RES.TOPIC than salt","p":[],"e":"I like/want sugar less than salt."},{"k":"e","n":"Example 11.6","sub":[],"s":[". rmak ul as u sarN ,auad us ."],"r":"Su-dauwei nras u sa lu kamr.","g":"food least-LINK RES.TOPIC LINK 1 have","p":[],"e":"I have the least food."}]},
            {"n":12,"t":"Negation","r":"Vej","s":"jev","b":[{"k":"p","h":"There are two ways how to negate in Arusian. The common way is by making the root <i>Vej</i> (meaning “void/nothing”) negate the entire sentence. One can also, prefix the root Vej to any noun root to negate it. Here are some examples below."},{"k":"h","t":"Using Sentential Negative"},{"k":"e","n":"Example 12.1","sub":[],"s":[". os ruo ul as jev ."],"r":"Vej sa lu ouwr so.","g":"NEG LINK 1 like 3.OBV","p":[],"e":"I do not like/want it."},{"k":"e","n":"Example 12.2","sub":[],"s":[". feM as jev ."],"r":"Vej sa mef.","g":"nothing LINK animal","p":[],"e":"There are no animals."},{"k":"e","n":"Example 12.3","sub":[],"s":[". suP os as jev ."],"r":"Vej sa so pus.","g":"NEG LINK 3 here-LINK","p":[],"e":"He/She/It is not here."},{"k":"e","n":"Example 12.4","sub":[],"s":[". saua ul as jev ."],"r":"Vej sa lu auwas.","g":"NEG LINK 1 see.","p":[],"e":"I can’t see."},{"k":"p","h":"In the examples above, the root <i>vej</i> is the topic and is negating the rest of the sentence. Most sentences are negated this way."},{"k":"e","n":"Example 12.3","sub":[],"s":[". os ruo m.ov as jev as ,ak ,auP ."],"r":"Puwei-kei sa vej sa vom ouwr so.","g":"Q-reason LINK NEG LINK person want 3.OBV","p":[],"e":"Why does no one want it?"},{"k":"p","h":"The clause, <i>vom ouwr so</i> (people want it) is commented onto the negator <i>vej</i> . Thus, the entire negated clause, <i>vej sa vom ouwr so</i> (people don’t want it) is commented onto the topic <i>Puwei-kei</i> (why)."},{"k":"h","t":"Using Nominal Negatives"},{"k":"p","h":"The negative can be made by using the noun root <i>Uwa</i> (void/nothing). For the nominal negative, the root Uwa is verbalised to Uwaai and prefixed to a noun to negate it."},{"k":"e","n":"Example 12.5","sub":[],"s":[". os ruo m.ov ,aaau ."],"r":"Uwaai-vom ouwr so.","g":"nobody want 3.OBV","p":[],"e":"Nobody wants it."},{"k":"e","n":"Example 12.6","sub":[],"s":[". suP feM ,aaau ."],"r":"Uwaai-mef pus.","g":"No-animal here-LINK","p":[],"e":"There are no animals here."},{"k":"p","h":"In Example 5, <i>Uwaai</i> prefixed to the root Vom (human/person) together meaning nobody. In Example 6, <i>Uwaai</i> is prefixed to the root mef (animal). Uwaai-mef forms a single word meaning “no-animal”."}]},
            {"n":13,"t":"Time","r":"Seg","s":"Ges","b":[{"k":"p","h":"Arusian is different in its approach to expressing time. It is a tense-less language; in other words, there is no grammatical category of time."},{"k":"t","cap":[["t","Time Termology"]],"rows":[[{"c":1,"th":false,"l":[["t","Time"]]},{"c":1,"th":false,"l":[["t","Past"]]},{"c":1,"th":false,"l":[["t","Present"]]},{"c":1,"th":false,"l":[["t","Future"]]}],[{"c":1,"th":false,"l":[["s","Ges"],["r","Seg"],["n","(time)"]]},{"c":1,"th":false,"l":[["s","sarGerM Ges"],["r","Seg mregras"],["n","(time leaving)"]]},{"c":1,"th":false,"l":[["s","suP Ges"],["r","Seg pus"],["n","(now)"]]},{"c":1,"th":false,"l":[["s","sarGert Ges"],["r","Seg tregras"],["n","(time coming)"]]}],[{"c":1,"th":false,"l":[["s","leu"],["r","Uwel"],["n","(hour)"]]},{"c":1,"th":false,"l":[["s","sarGerM leu"],["r","Uwel mregras"],["n","(hour leaving)"]]},{"c":1,"th":false,"l":[["s","suP leu"],["r","Uwel pus"],["n","(hour here)"]]},{"c":1,"th":false,"l":[["s","sarGert leu"],["r","Uwel tregras"],["n","(hour coming)"]]}],[{"c":1,"th":false,"l":[["s","art"],["r","Tra"],["n","(day)"]]},{"c":1,"th":false,"l":[["s","sarGerM art"],["r","Tra mregras"],["n","(day leaving)"]]},{"c":1,"th":false,"l":[["s","suP art"],["r","Tra pus"],["n","(today)"]]},{"c":1,"th":false,"l":[["s","sarGert art"],["r","Tra tregras"],["n","(day coming)"]]}],[{"c":1,"th":false,"l":[["s","urN"],["r","Nru"],["n","(month)"]]},{"c":1,"th":false,"l":[["s","sarGerM urN"],["r","Nru mregras"],["n","(month leaving)"]]},{"c":1,"th":false,"l":[["s","suP urN"],["r","Nru pus"],["n","(month here)"]]},{"c":1,"th":false,"l":[["s","sarGert urN"],["r","Nru tregras"],["n","(month coming)"]]}],[{"c":1,"th":false,"l":[["s","oag"],["r","Gau"],["n","(Year)"]]},{"c":1,"th":false,"l":[["s","sarGerM oag"],["r","Gau mregras"],["n","(year leaving)"]]},{"c":1,"th":false,"l":[["s","suP oag"],["r","Gau pus"],["n","(year here)"]]},{"c":1,"th":false,"l":[["s","sarGert oag"],["r","Gau tregras"],["n","(year coming)"]]}]]},{"k":"h","t":"Using No Conveyed Time"},{"k":"e","n":"Example 13.1","sub":[],"s":[". cet rt ul ."],"r":"Lu tr tek I come school","g":"","p":[],"e":"I go to school."},{"k":"p","h":"Unlike English, Arusian verbs do not have tense, so the sentence in Example 13.1, <i>lu tr tek</i> , is not in the past, present, or future. The time is not specified and is usually inferred from the context provided by the speaker. Timeless sentences such as these can be interpreted as general events that happen repeatedly, as in ‘I go to school’ is a regular or everyday process."},{"k":"h","t":"Using Present Time"},{"k":"e","n":"Example 13.2","sub":[],"s":[". suP Ges as u cet rt ul ."],"r":"Lu tr tek u sa seg pus.","g":"1 go school RES.TOPIC LINK time here-LINK","p":[],"e":"I am going to school now."},{"k":"p","h":"In Example 13.2, the clause <i>seg pus</i> (now) is commented to the resumptive pronoun <i>u</i> which refers to the topic clause <i>lu tr tek</i> (I go to school), and is indicating that <i>lu tr tek</i> (I go to school) is taking place in the present."},{"k":"e","n":"Example 13.3","sub":[],"s":[". suP leu rGes u cet rt ul ."],"r":"Lu tr tek u segr wel pus.","g":"go school RES.TOPIC during hour here-LINK","p":[],"e":"I am going to school this hour."},{"k":"p","h":"In Example 13.3, the clause <i>uwel pus</i> (this hour) is commented to the resumptive pronoun <i>u</i> which refers to the topic clause <i>lu tr tek</i> (I go to school), and is indicating that <i>lu tr tek</i> (I go to school) is taking place within the hour."},{"k":"e","n":"Example 13.4","sub":[],"s":[". suP art rGes u cet rt ul ."],"r":"Lu tr tek u segr tra pus.","g":"1 go school RES.TOPIC during day here-LINK","p":[],"e":"I am going to school today."},{"k":"p","h":"In Example 13.4, the clause <i>tra pus</i> (today) is commented to the nominalized topic clause <i>lu tr tek</i> (I go to school), and is indicating that the topic clause is taking place within the day."},{"k":"h","t":"Using Past Time"},{"k":"e","n":"Example 13.5","sub":[],"s":[". sarGerM Ges as u cet rt ul ."],"r":"Lu tr tek u sa seg mregras.","g":"1 come school RES.TOPIC LINK time leave-LINK","p":[],"e":"I went to school."},{"k":"p","h":"In Example 13.5, the clause <i>seg mregras</i> (past) is commented to the resumptive pronoun <i>u</i> which refers to the topical clause <i>lu tr tek</i> (I go to school)."},{"k":"e","n":"Example 13.6","sub":[],"s":[". sarGerM leu rGes u cet rt ul ."],"r":"Lu tr tek u segr wel mregras.","g":"come school RES.TOPIC during hour leave-LINK","p":[],"e":"I went to school last hour."},{"k":"p","h":"In Example 13.6, the clause <i>uwel mregras</i> (last hour) is commented to the resumptive pronoun <i>u</i> which refers to the topical clause <i>lu tr tek</i> ."},{"k":"e","n":"Example 13.7","sub":[],"s":[". sarGerM urN rGes u cet rt ul ."],"r":"Lu tr tek u segr nru mregras.","g":"1 come school RES.TOPIC during month leave-LINK","p":[],"e":"I went to school last month."},{"k":"p","h":"In Example 13.7, the clause <i>nru mregras</i> (last month) is commented to the resumptive pronoun <i>u</i> which refers to the topical clause <i>lu tr tek</i> (I go to school)."},{"k":"h","t":"Using Future Time"},{"k":"e","n":"Example 13.8","sub":[],"s":[". sarGert Ges as u cet rt ul ."],"r":"Lu tr tek u sa seg tregras.","g":"2 do 3 RES.TOPIC LINK time come-LINK","p":[],"e":"I will go to school."},{"k":"p","h":"In Example 13.8, the clause <i>seg tregras</i> (future) is commented to the resumptive pronoun <i>u</i> which refers to topical clause <i>lu tr tek</i> (I go to school)."},{"k":"e","n":"Example 13.9","sub":[],"s":[". sarGert leu rGes u cet rt ul ."],"r":"Lu tr tek u segr wel tregras.","g":"do RES.TOPIC during time come-LINK","p":[],"e":"I will go to school next/in a few hours."},{"k":"p","h":"In Example 13.9, the clause <i>uwel tregras</i> (coming hour) is commented to the resumptive pronoun <i>u</i> which refers to the topical clause <i>lu tr tek</i> (I go to school)."},{"k":"e","n":"Example 13.10","sub":[],"s":[". sarGert urN rGes u cet rt ul ."],"r":"Lu tr tek u segr nru tregras.","g":"2 do 3 RES.TOPIC during month come-LINK","p":[],"e":"I will go to school next/in a few months."},{"k":"p","h":"In Example 13.10, the clause <i>nru tregras</i> (coming month) is commented to the resumptive pronoun <i>u</i> which refers to the topical clause <i>lu tr tek</i> (I go to school)."},{"k":"h","t":"Incomplete Actions"},{"k":"e","n":"Example 13.11","sub":[],"s":[". s,aaaP u os rok ul ."],"r":"Lu kor so u paais.","g":"1 do 3.OBV RES.TOPIC incomplete-LINK","p":[],"e":"I am in the middle of doing it."},{"k":"p","h":"In Example 13.11, the noun <i>pa</i> translates to &#x27;incompletion&#x27; or &#x27;in progress.&#x27; It is used when an action is ongoing. Here, the intransitive verb form is being used."},{"k":"h","t":"Complete Actions"},{"k":"e","n":"Example 13.12","sub":[],"s":[". s,aaag u sauaeal ul ."],"r":"Lu layauwas u gaais.","g":"prepare-LINK RES.TOPIC complete-LINK","p":[],"e":"I finished preparing."},{"k":"p","h":"In Example 13.12, the noun <i>ga</i> translates to &#x27;completion&#x27; or &#x27;fullness.&#x27; It is used when an action is finished, or will be finished. Here, the intransitive verb form is being used."},{"k":"e","n":"Example 13.13","sub":[],"s":[". s,aaar u sauaeal ul ."],"r":"Lu layauwas u raais.","g":"1 prepare-LINK RES.TOPIC won-LINK","p":[],"e":"I am ready."},{"k":"p","h":"In Example 13.13, the noun <i>ra</i> translates to &quot;victory&quot; or &quot;sucess.&quot; It is used to indicate that an action is accomplished."},{"k":"h","t":"Contemplated Actions"},{"k":"e","n":"Example 13.14","sub":[],"s":[". s,aaalt u sauok ul ."],"r":"Lu kouwas u tlaais.","g":"1 do-LINK RES.TOPIC contemplated-LINK","p":[],"e":"I want to do (it)."},{"k":"p","h":"In Example 13.14, the noun <i>tla</i> translates to &#x27;incompletion&#x27;. It is used when an action is ongoing. Here, the intransitive verb form is being used."},{"k":"h","t":"Irrealis Actions"},{"k":"e","n":"Example 13.15","sub":[],"s":[". s,aeut u s,auag ul ."],"r":"Lu gauweis u tuweyeis .","g":"being.fallen-LINK RES.TOPIC considered-LINK","p":[],"e":"I would have fallen."},{"k":"p","h":"In Example 13.15, the intransitive verb <i>tuweyei</i> translates to &#x27;if&#x27; or ‘would’ and is difficult to translate into English. It is commented onto the clause to indicate the action is an idea, and not reality."},{"k":"h","t":"Scheduling Events"},{"k":"p","h":"To talk about events that happened or will happen, such as the arrival of the bus, or a scheduled event, you can use the following stucture in the examples below."},{"k":"e","n":"Example 13.16","sub":[],"s":[". sarGert ,au at ,aP as leu rGes u sauuN ,aaN ."],"r":"Nai nuuwas u segr wel sa pei-ta wei tregras.","g":"ride arrive-LINK RES.TOPIC during hour LINK NUM-two RES.COM come-LINK","p":[],"e":"The bus arrives in two hours."},{"k":"e","n":"Example 13.17","sub":[],"s":[". sarGerM ,au sa leu rGes u suP lev ."],"r":"Vel pus u segr wel as wei mregras.","g":"female here-LINK RES.TOPIC during hour single-LINK RES.COM leave-LINK","p":[],"e":"The girl was here an hour ago."},{"k":"h","t":"Telling Time"},{"k":"p","h":"In this chapter, we will learn how to tell time in Arusian. Below, two charts of common words of how to tell time are shown in the chart below."},{"k":"t","cap":[["t","Traditional Hours of The Day"]],"rows":[[{"c":1,"th":false,"l":[["s","m,et ,aau ,arGed"],["r","degrei-wai-tim"],["n","12:00 AM - 3:00 AM"]]},{"c":1,"th":false,"l":[["s",",aav ,aarM ,arGed"],["r","degrei-mrai-vai"],["n","3:00 PM - 12:00 PM"]]}],[{"c":1,"th":false,"l":[["s","m,et ,aau ,auoN"],["r","nouwei-wai-tim"],["n","3:00 AM - 6:00AM"]]},{"c":1,"th":false,"l":[["s",",aav ,aarM ,auoM"],["r","nouwei-mrai-vai"],["n","6:00 PM - 3:00 PM"]]}],[{"c":1,"th":false,"l":[["s",",aav ,aau ,arGed"],["r","nouwei-wai-vai"],["n","9:00 AM - 6:00AM"]]},{"c":1,"th":false,"l":[["s","m,et ,aarM ,arGed"],["r","degrei-mrai-tim"],["n","9:00 PM - 6:00 PM"]]}],[{"c":1,"th":false,"l":[["s",",aav ,,aau ,auoN"],["r","nouwei-wai-vai"],["n","12:00 PM - 9:00AM"]]},{"c":1,"th":false,"l":[["s","m,et ,aarM ,,auoN"],["r","nouwei-mrai-tim"],["n","12:00 AM - 9:00 PM"]]}]]},{"k":"t","cap":[["t","More Time Termology"]],"rows":[[{"c":1,"th":false,"l":[["t","Morning"]]},{"c":1,"th":false,"l":[["s",",aau"],["r","uwai"]]}],[{"c":1,"th":false,"l":[["t","Morning (sun-out)"]]},{"c":1,"th":false,"l":[["s",",aav ,aau"],["r","uwai-vai"]]}],[{"c":1,"th":false,"l":[["t","Noon"]]},{"c":1,"th":false,"l":[["s","oN ,aau"],["r","uwai-no"]]}],[{"c":1,"th":false,"l":[["t","Afternoon / Night"]]},{"c":1,"th":false,"l":[["s",",aarM"],["r","Mrai"]]}],[{"c":1,"th":false,"l":[["t","Noon"]]},{"c":1,"th":false,"l":[["s",",aav ,aarM"],["r","Mrai-vai"]]}],[{"c":1,"th":false,"l":[["t","Night (dark)"]]},{"c":1,"th":false,"l":[["s","m,et ,aarM"],["r","Mrai-tim"]]}],[{"c":1,"th":false,"l":[["t","Midnight"]]},{"c":1,"th":false,"l":[["s","oN ,aarM"],["r","mrai-no"]]}],[{"c":1,"th":false,"l":[["t","Morning (dark)"]]},{"c":1,"th":false,"l":[["s","m,et ,aau"],["r","Uwai-tim / Wai-tim"]]}]]},{"k":"p","h":"To tell time, you can use the above phrases to express the hour. Arusians usually use these words to tell the hour rather than using temporal numerals, which well be covered later. Here are a few examples below."},{"k":"e","n":"Example 13.18","sub":[],"s":[". rleu ,au s,armuN ul as m,et ,aau ."],"r":"Uwai-tim sa lu numreis wei welr.","g":"morning-darkness LINK sleep-LINK RES.COM during","p":[],"e":"I sleep after midnight."},{"k":"e","n":"Example 13.19","sub":[],"s":[". ,aav ,aau rleu u s,auok us ."],"r":"Su kouwas u welr wai-vai.","g":"3 work-LINK RES.TOPIC during morning-light","p":[],"e":"He/She/it works in the after sunrise."},{"k":"p","h":"To tell time in a more precise manner, we start with the word, <i>uwel</i> then we attach the hour of the day. Here are a few examples below."},{"k":"e","n":"Example 13.20","sub":[],"s":[". suP u at al as leu ."],"r":"Uwel sa la-ta u pus.","g":"hour LINK second RES.TOPIC here-LINK","p":[],"e":"It is 2 AM."},{"k":"p","h":"In Example 13.20, the clause, <i>uwel sa la-ta</i> means 2 o’clock. <i>Wel sa la-ta</i> is commented by <i>pus (of here)</i> meaning the hour is now."},{"k":"e","n":"Example 13.21","sub":[],"s":[". suP u ,aM at ad fet al as leu ."],"r":"Uwel sa la-tef-da-ta-mei u pus.","g":"hour LINK thirteenth RES.TOPIC here-LINK","p":[],"e":"It is 1 PM."},{"k":"p","h":"In Example 13.21, the word <i>la-tef-da-ta-mei</i> meaning ‘thirteenth’ is following the word hour. In Arusian, we use the 24-hour system to tell time and 1:00 PM is 13:00."},{"k":"e","n":"Example 13.22","sub":[],"s":[". suP u ,aM at ad ara as leu ."],"r":"Uwel sa ara-da-ta-mei u pus.","g":"hour-19 here-LINK","p":[],"e":"It is 7 PM."},{"k":"p","h":"In Example 13.22, we have the time <i>wel sa la-ara-da-ta-mei</i> (19 o’clock). The time is commented by <i>pus</i> meaning, ‘of here’. We can add the minutes by following the structure of the next example."},{"k":"e","n":"Example 13.23","sub":[],"s":[". suP u sund ceuM as u ceP al as leu ."],"r":"Uwel sa la-pek u sa muwek dnus u pus.","g":"hour LINK fourth RES.TOPIC LINK minute half-COP RES.TOPIC here-LINK","p":[],"e":"It is 4:30. / It is 4:30 AM."},{"k":"p","h":"In Example 13.23, the time 4:30 is <i>wel sa la-pek u sa muwek dnus</i> . This is quite long, but let us break this down. In front, we have the hour portion of the time, which is <i>wel sa la-pek</i> , meaning 4:00 AM. Connected with the linker <i>u sa</i> , we have the minutes of the hour, which is <i>muwek dnus</i> . The word <i>muwek</i> means minute, and <i>dnu</i> means half."},{"k":"e","n":"Example 13.24","sub":[],"s":[". rleu ,au s,auarv ul as u ara al as leu ."],"r":"Uwel sa la-ara u sa lu vrauweis wei welr.","g":"hour-LINK ninth RES.TOP LINK wake COM when","p":[],"e":"I wake up at AM."},{"k":"p","h":"In Example 13.24, we are using the markers from chapter with the hour of the day. It literally translates to “during AM, I wake up”."},{"k":"p","h":"Below is a table of the months of the year and the days of the week."},{"k":"t","cap":[["t","Months of The Year"]],"rows":[[{"c":1,"th":false,"l":[["s","cev urN"],["r","Nru-vek"],["n","January"]]},{"c":1,"th":false,"l":[["s","aulk urN"],["r","Nru-kluwa"],["n","Febraury"]]},{"c":1,"th":false,"l":[["s",",aab urN"],["r","Nru-bai"],["n","March"]]},{"c":1,"th":false,"l":[["s","fek urN"],["r","Nru-kef"],["n","April"]]}],[{"c":1,"th":false,"l":[["s",",aa urN"],["r","Nru-ai"],["n","May"]]},{"c":1,"th":false,"l":[["s","Ges urN"],["r","Nru-seg"],["n","June"]]},{"c":1,"th":false,"l":[["s","oM urN"],["r","Nru-mo"],["n","July"]]},{"c":1,"th":false,"l":[["s","je urN"],["r","Nru-ej"],["n","August"]]}],[{"c":1,"th":false,"l":[["s","Gek urN"],["r","Nru-keg"],["n","September"]]},{"c":1,"th":false,"l":[["s","muj urN"],["r","Nru-jum"],["n","October"]]},{"c":1,"th":false,"l":[["s","oal urN"],["r","Nru-lau"],["n","November"]]},{"c":1,"th":false,"l":[["s","jaN urN"],["r","Nru-naj"],["n","December"]]}]]},{"k":"p","h":"The months are named after significant Arusian celebrations and holidays that are deeply embedded in the culture. These names are believed to predate the Arusian language itself."},{"k":"t","cap":[["t","Days of the Week"]],"rows":[[{"c":1,"th":false,"l":[["s","Ged al art"],["r","Tra-la-deg"],["n","Monday"]]},{"c":1,"th":false,"l":[["s","at al art"],["r","Tra-la-ta"],["n","Tuesday"]]},{"c":1,"th":false,"l":[["s","fet al art"],["r","Tra-la-tef"],["n","Wednesday"]]},{"c":1,"th":false,"l":[["s","ceP al art"],["r","Tra-la-pek"],["n","Thursday"]]}],[{"c":1,"th":false,"l":[["s",",aM al art"],["r","Tra-la-mei"],["n","Friday"]]},{"c":1,"th":false,"l":[["s","oak al art"],["r","Tra-la-kau"],["n","Saturday"]]},{"c":1,"th":false,"l":[["s","oN al art"],["r","Tra-la-no"],["n","Sunday"]]},{"c":1,"th":false,"l":[]}]]},{"k":"h","t":"Telling the Year"},{"k":"p","h":"To tell time, we either start with the word, <i>gau</i> . Here are a few examples below."},{"k":"e","n":"Example 13.25","sub":[],"s":[". rGes u sarGed ul as u ara ad ced ,aM at at al as oag ."],"r":"Gau sa la-ara-da-ta-ta-mei-dek u sa lu degras wei segr.","g":"Year LINK 2009 RES.TOPIC LINK 1 start RES.COM during","p":[],"e":"I start in 2009."},{"k":"p","h":"In Example 13.25, the marker <i>gau</i> meaning year is being used to form the date, the <i>gau</i> is a type of number marker, used for telling the year. Similar to how <i>pei</i> is a marker for numerals, and <i>uwel</i> is a marker for time numerals."},{"k":"h","t":"Telling the Day of the Month"},{"k":"p","h":"To tell time, we either start with the word, <i>tra</i> . Here are a few examples below."},{"k":"e","n":"Example 13.26","sub":[],"s":[". suP u ,aab urN as u ,aM at at ad at al as art ."],"r":"Tra sa la-ta-da-ta-ta-mei u sa nru-bai u pus.","g":"Day LINK 22th RES.TOPIC LINK 1 march RES.TOPIC here-LINK","p":[],"e":"It is the 22 nd of March."},{"k":"p","h":"In Example 13.26, the marker <i>tra</i> meaning day is being used to form the date."}]},
            {"n":14,"t":"Location","r":"Pai","s":", aaP","b":[{"k":"p","h":"Arusian speakers use the roots <i>pu (here)</i> , <i>fu (there), fo (there)</i> and <i>pai</i> <i>(location)</i> to indicate the location of themselves or other things. <i>Pu</i> can translate to here, this, at, or in, and is used for things near the speaker. <i>Fu</i> can translate to there, that, at, or in and is used for things near the listener. <i>Fo</i> can translate to there and is used for things away from both the speaker and listener. <i>Pai</i> means location or place, and serves as a generic location term. Here are some examples using <i>pu</i> , <i>fu, fo</i> and <i>pai.</i>"},{"k":"h","t":"Using Pu"},{"k":"p","h":"In the following examples <i>pu (here)</i> is used. <i>Pu</i> is used for talking about objects close to the speaker."},{"k":"e","n":"Example 14.1","sub":[],"s":[". ruP ul ,at as TuN ,aaP ."],"r":"Pai-nut sa tei-lu puwr.","g":"restaurant LINK 1P.INCL here","p":[],"e":"We are here at the restaurant."},{"k":"p","h":"In Example 14.1, <i>pu</i> is being used as the actor, transitive verb <i>puwr</i> . <i>Pai-nut</i> is the object of the verb <i>puwr</i> , and <i>tei-lu</i> is the subject. The transitive, actor verb <i>puwr</i> is used here because there is an object in the sentence that <i>puwr</i> is acting on."},{"k":"e","n":"Example 14.2","sub":[],"s":[". ,r suP TuN ,aaP as ul ,at ."],"r":"Tei-lu sa pai-nut puse.","g":"1P.INCL LINK restaurant here","p":[],"e":"We are here at the restaurant."},{"k":"p","h":"In Example 14.2, the elements have switched, in which the topic is now <i>tei-lu.</i> The patient transitve verb <i>puse</i> is connected to its subject <i>Pai-nut</i> . This construction is impossible to say in English, as this is like saying, “the restaurant is hered by us”."},{"k":"e","n":"Example 14.3","sub":[],"s":[". suP ul ,at ."],"r":"Tei-lu pus.","g":"1P.INCLUSIVE here-LINK","p":[],"e":"We are here."},{"k":"p","h":"In Example 14.3, one can just use the root <i>pu</i> and connect it to indicate “we are here”."},{"k":"h","t":"Using Fu"},{"k":"p","h":"In the following examples <i>fu</i> (there) is used. <i>Fu</i> is used for talking about objects close to the listener."},{"k":"e","n":"Example 14.4","sub":[],"s":[". ruF ,at as TuN ,aaP ."],"r":"Pai-nut sa tei fuwr.","g":"restaurant LINK there","p":[],"e":"You are at the restaurant."},{"k":"p","h":"In Example 14.4, <i>fu</i> is being used as the actor, transitive verb <i>fuwr</i> . <i>Pai-nut</i> is the object of the verb <i>fuwr</i> , and <i>tei-lu</i> is the subject. The transitive, actor verb <i>fuwr</i> is used here because there is an object in the sentence that <i>fuwr</i> is acting on."},{"k":"e","n":"Example 14.5","sub":[],"s":[". ,r suF TuN ,aaP as ,at ."],"r":"Tei sa pai-nut fuse.","g":"at-restaurant LINK 2 there","p":[],"e":"You are at the restaurant."},{"k":"p","h":"In Example 14.5, the elements have switched, in which the topic is now <i>tei.</i> The patient transitve verb fuse is connected to its subject <i>Pai-nut</i> . This construction is impossible to say in English, as this is like saying, “the restaurant is thered by you”."},{"k":"e","n":"Example 14.6","sub":[],"s":[". suF TuN ,aaP ."],"r":"Pai-nut fus.","g":"restaurant there-LINK","p":[],"e":"The restaurant is there."},{"k":"p","h":"In Example 14.6, one can just use the root <i>fu</i> and connect it to <i>Pai-nut</i> (restaurant). The sentence are implies the restaurant is by the listener."},{"k":"h","t":"Using Fo"},{"k":"p","h":"In the following examples <i>fo (there)</i> is used. <i>Fo</i> is used for talking about objects distant from both the speaker and listener."},{"k":"e","n":"Example 14.7","sub":[],"s":[". roF os as TuN ,aaP ."],"r":"Pai-nut sa so for.","g":"restaurant LINK 3 there","p":[],"e":"He/She is at the restaurant."},{"k":"p","h":"In Example 14.7, <i>fo</i> is being used as the actor, transitive verb <i>for</i> . <i>Pai-nut</i> is the object of the verb <i>for</i> , and <i>so</i> is the subject. The transitive, actor verb <i>for</i> is used here because there is an object in the sentence that <i>for</i> is acting on."},{"k":"e","n":"Example 14.8","sub":[],"s":[". ,r soF TuN ,aaP as us ."],"r":"Su sa pai-nut fose.","g":"3 LINK restaurant there","p":[],"e":"He/She/It is at the restaurant."},{"k":"p","h":"In Example 14.8, the elements have switched, in which the topic is now <i>Su.</i> The patient transitve verb fose is connected to its subject <i>Pai-nut</i> . This construction is impossible to say in English, as this is like saying, “the restaurant is thered him/her/it”."},{"k":"e","n":"Example 14.9","sub":[],"s":[". soF TuN ,aaP ."],"r":"Pai-nut fos.","g":"LINK restaurant there","p":[],"e":"He/She/It is at the restaurant."},{"k":"p","h":"In Example 14.9, one can just use the root <i>fo</i> and connect it to <i>Pai-nut</i> (restaurant). The sentence are implies the restaurant is by the listener."},{"k":"h","t":"Using Pai"},{"k":"p","h":"In the following examples <i>pai (location)</i> is used. <i>Pai</i> is used for talking about objects located in any given place."},{"k":"e","n":"Example 14.10","sub":[],"s":[". r,aaP ul ,at as TuN ,aaP ."],"r":"Pai-nut sa tei-lu payr.","g":"Restaurant of 1P.INCL located.at","p":[],"e":"We are here at the restaurant."},{"k":"p","h":"In Example 14.10, <i>pai</i> is being used as the actor, transitive verb <i>payr</i> . <i>Pai-nut</i> is the object of the verb <i>payr</i> , and <i>tei-lu</i> is the subject. The transitive, actor verb <i>payr</i> is used here because there is an object in the sentence that <i>puwr</i> is acting on."},{"k":"e","n":"Example 14.11","sub":[],"s":[". ,r s,aaP TuN ,aaP as ul ,at ."],"r":"Tei-lu sa pai-nut paise.","g":"1P.INCL LINK restaurant located.by","p":[],"e":"We are here at the restaurant."},{"k":"p","h":"In Example 14.11, the elements have switched, in which the topic is now <i>tei-lu.</i> The patient transitve verb puse is connected to its subject, <i>Pai-nut</i> . This construction is impossible to say in English, as this is like saying, “the restaurant is hered by us”."},{"k":"e","n":"Example 14.12","sub":[],"s":[". saeaP TuN ."],"r":"Nut payas.","g":"1P.INCLUSIVE there","p":[],"e":"There is food."},{"k":"p","h":"In Example 14.12, one can use intransitive actor verb <i>paya.</i> This verb translates to something like, “there is” in English."}]},
